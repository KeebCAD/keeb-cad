packages:
  - packages/*
  - app
  - fixtures

catalog:
  typescript: ~6.0.0
  vitest: ^5.0.5
  vue-tsc: ^3.3.11

strictPeerDependencies: true
hoist: false
publicHoistPattern: []

# lefthook's own postinstall is not needed: the root `prepare` script runs `lefthook install`.
allowBuilds:
  lefthook: false
