[workflow]

activation_steps_append = [
  "Before planning, check the story against the spine's Data Schema section (`_bmad-output/architecture-keeb-cad-layout-model/architecture-keeb-cad-layout-model.md`). If the work adds or changes any design-file field, schema or shared kind that the Data Schema does not define, stop and tell the user: the field schema is decided in the spine first. Do not invent the field.",
]

persistent_facts = [
  "Service or function in every plan: each class or function a plan adds is tagged `(service)` or `(function)` in its Code Map or task entry, by AD-25's split: code that does I/O or holds state is a `di` service; pure logic is a plain function. A tag that follows the split needs no decision line; a departure from it gets a `Decision (plan):` in the X, not Y, because Z form.",
  "Plan size in this project: the SCOPE STANDARD target is up to 3000 tokens, superseding the 900–1600 range in the workflow and the plan template's 'Target: 900–1300 / above 1600' comment. Step-02's token-count gate fires only above 3000 tokens.",
  "Every plan carries a boundary table: for each threshold the work introduces or relies on, one row just below, one on and one just above it, each with its input and expected output taken from the requirement. Rows are sorted into four groups (production bugs, rules, module boundaries, glue), and every row has a level column naming where its test runs (unit in the owning package, integration in `pipeline` or `app`, or end to end). The table is frozen as acceptance when the plan is approved: implementation adds tests for its rows and changes no row. Its rows do not count toward the 3000-token plan cap.",
  '''
Plan conformance. In step 2, after instruction 5's self-review, settle every `## Open Questions` entry the plan already has with the human first (instruction 6's Open Questions gate, run early), so the reviewer reads a plan that no longer moves. Then launch two context-free subagents on a Sonnet-class model in parallel, each with the prompt below; the plan's author does not judge its own plan. When both return, take the union of their findings, check each finding's quoted plan line against the plan and its quoted rule against `AGENTS.md` or the spine, drop any finding whose quote is not there, and say how many you dropped. For each remaining finding, fix the plan, or add an `## Open Questions` entry when only a person can decide, and settle those before going on. For a precedent finding, the plan follows the rule, and one entry goes to `deferred-work.md` naming the precedent file, its offending line and the rule. Then run one final pass: a single subagent with the same prompt, on the fixed plan. Fix or ask about its findings the same way, and do not run the reviewer again; at the checkpoint, name the final-pass fixes no reviewer has read. Then add `## Conformance Log` to the plan, after `## Design Notes`: one line per finding from every pass (the rule quoted, then `fixed`, `asked` or `deferred`), or `Checked N rules and M precedent files, no findings.` A guard hook refuses `status: 'ready-for-dev'` on a plan without this section.

The reviewer's prompt:

You check a plan against the rules this repository agreed on; you report and fix nothing. You did not write the plan and did not see its author's reasoning: judge the text in front of you.

Read `AGENTS.md` at the repository root, every section. Read the plan at `{plan_file}` and the ticket it names. Read the sections of the spine (`_bmad-output/architecture-keeb-cad-layout-model/architecture-keeb-cad-layout-model.md`) that the plan or the ticket cite, and the spine's glossary and Naming row. Then run these checks, in this order:

1. Rules. For each rule in `AGENTS.md` and each cited spine decision the work touches, does a line of the plan (Code Map, tasks, boundary table, design notes, sketches) contradict it, or leave the implementer to choose where the rule has already chosen?
2. Precedent. Open every existing file the plan names as a pattern, an example, or something to copy, follow or extend, and check that file against the same rules. A precedent that breaks a rule is a finding even when the plan copies it faithfully: the rule wins over the precedent. For a precedent that is a spec or test file, also run checks 1 to 8 of the `test-reviewer` lens in `_bmad/custom/bmad-build.toml` on each of its tests.
3. Sketches. Every code sketch in the plan is code the implementer will copy. Check its names, file layout, types and tests against the rules.
4. Names. Check every new name the plan introduces against the spine's glossary and Naming row.
5. Service or function. Every class or function the plan adds carries a `(service)` or `(function)` tag in its Code Map or task entry. Report one with no tag, and a tag that contradicts AD-25's split for what the thing does (I/O or state tagged `(function)`, pure logic tagged `(service)`) unless a `Decision (plan):` gives that departure.
6. Saved work. For each boundary-table row whose expected result deletes, replaces or prunes saved data (a stored version, a saved file, a design), say what saved copy of that data remains after the row, including when a retry or a later step in that row fails. Report a row after which no saved copy remains. The planner fixes the row, or asks Sergii when only he can decide.

Every finding quotes, verbatim and each in backticks: the plan line, and the rule (the `AGENTS.md` line or the spine sentence); a precedent finding also quotes the offending line of the precedent file, with its path. A check 6 finding quotes the row and names the data left with no saved copy, instead of a rule. Then say what is wrong and what would satisfy the rule. There is no minimum number of findings: "checked N rules and M precedent files, no findings" is a full answer.

Review by inspection only. Do not modify files, run builds or tests, or invoke quality gates. Do not invoke any skill, and do not spawn subagents of your own; you are the reviewer. Return your findings as text in your final message.

Gap review. Beside the two conformance readers, launch one more context-free subagent on a Sonnet-class model with the gap reviewer's prompt below. It runs once and is not part of the final pass. For each finding, check two things: its quoted rule is in `AGENTS.md` or the spine, and its named path exists or is a file the plan adds. Drop any finding that fails either check, and say how many. Fix the plan or ask about each remaining finding, as for conformance findings. Log each one in `## Conformance Log` as `gap:` followed by the member or user it names, then `fixed` or `asked`.

The gap reviewer's prompt:

You look for what a plan leaves out. You report and fix nothing; you did not write the plan. Read `AGENTS.md`, the plan at `{plan_file}`, the ticket it names, and the spine sections the plan or the ticket cite. Then run three checks:

1. Rules over a set. Take each sentence in `AGENTS.md` or those spine sections that applies to every member of a set ("each", "every", "all", "one per"). List every member of that set inside the packages the plan touches, both those in the repository today and those the plan adds, each with its path. Report each member the rule applies to that the plan leaves out.
2. Users of what the plan adds. For each export, file, subpath, rule or fence the plan adds or changes, list who `AGENTS.md` and the spine allow to use it. Give a path for each existing user, and the spine sentence for each future one. Report each allowed user the planned design would block or not reach.
3. Reachable states. For each ticket verify sentence, name the code path that reaches the state it arranges, in the repository today or through a story the spine names, by `AGENTS.md`'s "Arrange only a state real commands could reach". Report a sentence whose state no path reaches; the planner turns it into an Open Question.

Every finding quotes the rule verbatim, names the member or user with its path, and says what the plan would need to add. A finding without a path is not a finding. Don't report what no rule requires, and don't propose new rules. "Checked N rules over a set and M added things, no gaps" is a full answer. Review by inspection only. Do not modify files, run builds or tests, invoke any skill, or spawn subagents of your own. Return your findings as text in your final message.
''',
  "Unplanned structural changes go to Sergii. After step 3's verification, before review: list the files the diff since `baseline_revision` changes. If it changes a `tsconfig*.json`, a `package.json`'s dependencies, `pnpm-workspace.yaml`, a Vitest, ESLint, Stryker or dependency-cruiser config, or adds a `declare global` or `declare module`, and the plan's Code Map and tasks don't name that change, HALT. Ask Sergii one question: the change, why the build needed it, the implementer's pick, and its rejected alternative. Record his answer in the plan's Implementation Notes as `Decision (Sergii):`, then review.",
  "A rejection needs evidence, or it goes to Sergii. Every `Decision` a build records, whether a plan's `Decision (plan):` or the implementer's own decisions, cites what rejects its alternative: a command and its result (`tsc -p packages/design/tsconfig.lib.json: Cannot find name 'structuredClone'`), or a quoted `AGENTS.md`, spine or ticket line, or, for a pick that is a Stack dependency's documented default or setup, a quoted line or link from that library's docs. A decision with none of these is marked *judgement*. In step 2, each *judgement* decision becomes an `## Open Questions` entry with the build's pick, settled before checkpoint 1. After step 3, each *judgement* decision in the implementer's report becomes one question to Sergii with its pick, before review. His answer is recorded as `Decision (Sergii):`. A rejected alternative that one command can try is tried, and its result is the citation.",
  "Sergii looks before a build is declared built. After step 4's review, before step 5: HALT. Leave the plan `in-review`, commit nothing, and tell Sergii the work is ready for his look: what changed in a few lines, the verification result, and how to see each visual change (the workbench or app command and what to look at). Mark the plan `built` and commit only after he says so; open a PR only when he asks.",
]

