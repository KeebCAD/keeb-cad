# Stories of epic-change-a-parameter. Table order is build order.

[[entry]]
id = 1
type = "story"
title = "Commands undo and redo, with cascading removal"
description = "One command registry in model: each command has a name and a display label, applies or returns a typed rejection, and lands on an undo stack with redo; a helper removes everything keyed to a removed item in the same command. epic-editor-shell's toasts and palette read the labels; every later epic adds its commands here, starting with epic-layout story 1."
verify = "Tests show a sequence of commands undone and redone back to byte-identical files, a rejected command leaving the design unchanged with its typed reason, and one undo restoring a removed item with everything keyed to it."
covers = ["R3"]
after = ["23.3"]
hitl = false
risk = "low"

[[entry]]
id = 2
type = "story"
title = "Parameters and expressions evaluate in resolve"
description = "The parameters section and one hand-written parser for the AD-17 grammar (numbers with mm, deg; names; + - * /; parentheses), evaluated only in model.resolve, which this story creates as resolve(authored, library), with unit checks; unit-mismatch and unresolvable-reference violations; setParameter, renameParameter rewriting every use, and deleteParameter rejected while referenced, naming its users. epic-editor-shell's expression field and Parameters slide-out call these; epic-layout story 1 resolves on it and epic-layout story 8's write-back edits its literal mm/deg terms."
verify = "Tests show wall + gap evaluating to its sum, mm + deg reporting unit-mismatch, renaming ks rewriting every expression that uses it, deleting a used parameter rejected with its users, and a parameter change re-evaluating its dependents."
covers = ["R5"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Groups override the default part"
description = "A group's defaultPart overrides meta.defaultPart by id; a slot with no part of its own takes its nearest ancestor's, else the design's; a reference to a design part that is not defined yet reports unresolvable-reference as a warning. The gap moved to 13.2 and key size to 13.4 (2026-11-01). epic-layout-editor entry 4 edits it."
verify = "A slot with no part of its own resolves the default part of its nearest ancestor group, else the design's; a group naming a design part not defined yet reports unresolvable-reference as a warning."
covers = ["R3", "R6"]
after = ["13.4"]
hitl = false
risk = "low"

[[entry]]
id = 7
type = "story"
title = "Library parts pinned by version, with setPart"
description = "A library part that isn't a blueprint (the M2 screw) pinned in library-versions by id and version, and the setPart command (one undo step) that sets a slot's part; 19.2's Part picker calls it. Cutouts, keep-outs and pins arrive with the plates and PCB stories (spine Data Schema, Recorded, not typed; 2026-11-01)."
verify = "setPart puts the M2 screw in a slot as one undo step; the design's library-versions pin its id and version; save and reopen are byte-identical."
covers = ["R3", "R5", "R6"]
after = [3]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Overlapping keys report overlap"
description = "The layout stage reports overlap between part envelopes on either side, with side-qualified ids and the overlap size in the message, error or warning by severity rule, recomputed live on every resolve. epic-layout-editor entry 7 shows its violations."
verify = "Rotating Corney's thumb fan into its neighbour reports overlap naming both side-qualified ids and the depth; undoing removes it."
covers = ["R6"]
after = ["13.4"]
hitl = false
risk = "low"

[[entry]]
id = 5
type = "story"
title = "Inspector and Design settings edit the selection"
description = "The inspector shows the selection's anchor, offset, chain and part fields with epic-editor-shell's expression field, mixed for differing values and one undo step for multi-selection typing; with nothing selected, Design settings show the form read-only, gap x, gap y and the default part (key, created by newDesign, 13.18); a group shows a default-part override with inherits <value>; a right-half node shows read-only geometry with derived from left/<id> and the mirrored-board lock, and the Fitted toggle Fitted: left / right sets a per-side override removing the part on that side, one undo step for a multi-selection (moved from 13.8 on 2026-10-30); a slot shows its Part field, a `key ›` link to the Parts tab, and a This slot section with only the inputs its part blueprint marks per-slot, each showing `inherits <part value>` until typed (EXPERIENCE.md, 2026-11-01). Uses epic-layout story 4."
verify = "Typing 5mm into a column offset previews live and commits on Enter; deg on a length shows unit-mismatch and the canvas keeps the last value; changing gap x re-spaces every chain."
covers = ["R4", "R8"]
after = ["13.7", "13.8", 3]
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Violations on the canvas and in the panel"
description = "Layout violations from epic-layout show on the canvas (overlap outlined solid or dashed, the anchor-cycle path, ●/▲ on ids) and in the violations panel (V, or the status strip counts), grouped by workspace and kind, errors first, tagged by revision; a click switches workspace, selects the named ids, fits and flashes them; F8 / Shift+F8 step; nothing is dismissed. The panel is the shared one later workspaces add their kinds to."
verify = "Rotating the thumb fan into its neighbour outlines the overlap and lists it in the panel; clicking it selects both keys and fits them; F8 steps to it with the panel closed; undo removes it from both."
covers = ["R7", "R8"]
after = [4, "13.3", "13.7"]
hitl = false
risk = "medium"
