# Stories of epic-change-a-parameter. Table order is build order.

next_id = 19

[[entry]]
id = 1
type = "story"
title = "Undo and redo replay patches, field edits coalesce"
description = "design's store gets undo and redo (spine AD-2, 2026-11-05): an undo entry holds its command's Immer forward and inverse patches (concatenated for a coalesced session) and the routing file reference; undo applies the inverse patches through DesignPatcher.apply, redo the forward ones, and the same patches go to the model worker; undo and redo replace the whole Committed, restoring the routing file each entry kept, which acceptDerivedFiles swaps for the one accepted at the current undo record's revision (14.1's plan), so redo gives back routes already computed; the fingerprints file is never restored. History is linear, unbounded in M1, with no per-command inverse code. run(handle, input, { coalesce: key }) appends a command's patches to the last entry when it carries that entry's key; any other command that commits, undo, redo or load closes the session (a command with no patches and an unavailable undo or redo leave it open, Sergii 2026-11-16). Undo or redo on an empty stack returns unavailable with command design.undo or design.redo (Sergii 2026-11-16). One undo restores a deleted node with everything 13.2's cascade removed with it. The history keeps no label: what the undo toast and the palette name is 16.4's (Sergii 2026-11-16, 14.1's plan)."
verify = "Tests show a sequence of commands undone and redone back to byte-identical files, with the worker mirror equal to main's design after each; a rejected command leaving the design and the stack unchanged with its typed reason; one undo restoring a deleted node with everything keyed to it; three commands with one coalesce key undone as one entry; a command with another key, an undo, a redo and a load each closing the session; undo and redo on an empty stack returning unavailable; redo after an accepted routing file giving that file back."
covers = ["R3"]
after = ["23.3", "23.24"]
hitl = false
risk = "low"

[[entry]]
id = 2
type = "story"
title = "Expressions parse and evaluate with units"
description = "expr's one parser for the AD-17 grammar, generated by peggy from a grammar file in expr, the generated parser committed with a Node spec that regenerates it and fails when it is stale (AD-17, 2026-11-16), and its evaluator, evaluate(expression, scope), against a given scope of parameter values. Numbers with mm, deg or no unit, parameter names (a letter, then letters, digits or _, never -), + - * /, unary minus, parentheses, whitespace between tokens; standard precedence, left-associative; 13.17's literals unchanged: the grammar widens the stub, so every string that parsed still parses. The tree carries source offsets on every node, so later stories splice expression text in place. + and - need equal units; a unitless factor or divisor keeps the quantity's unit; unit x unit and unit / unit are unit-mismatch; a name missing from the scope is unresolvable-reference; division by zero is division-by-zero (Data Schema, 2026-11-16). expr's literal API, parseExpression, which schema, model and blueprint call today, is rebuilt on the new parser and still accepts only one number with mm or deg, optionally negated, so its callers and its refusal tests are unchanged (Sergii 2026-11-16). No design section, schema, command or placement changes here: 8 switches the Expression schema and placement to full expressions in one step. A name such as mm or deg parses as a name; the evaluator finds no parameter by it (8 reserves them). A unitless value divided by a quantity (2 / 5mm) has no unit M1 can hold, so it is unit-mismatch."
verify = "Tests show wall + gap evaluating to its sum, 2 * wall + gap following precedence, (a + b) / 2 grouping, -gap negating, 1 - 2 - 3 grouping left; mm + deg, mm * mm and mm / mm failing as unit-mismatch; 2 * 5mm keeping mm; a division by zero failing as division-by-zero and a name missing from the scope as unresolvable-reference; a broken expression (2 * (gap +) failing with its offset, and an empty or whitespace-only one failing at offset 0; 2 / 5mm failing as unit-mismatch; every node of a parse carrying its source offsets; parseExpression still accepting every literal 13.17's stub accepted and refusing everything it refused (19, 19 mm, -mm, wall + gap); the drift spec failing when the committed parser differs from the grammar's."
covers = ["R5"]
after = []
hitl = false
risk = "medium"

[[entry]]
id = 8
type = "story"
title = "Parameters drive placement"
description = "The parameters section (Parameter[]: { name: ParameterName, value: Expression }; ParameterName its own schema, a letter, then letters, digits or _, never -, never mm or deg (reserved, Sergii 2026-11-16), unique, the item's key; the unit derived from the evaluated value, never stored; ItemId widens to include ParameterName), evaluated by model/worker's computeds through 2's evaluator against the design's parameters, so nodes place from expressions. Parameter references are dependency-graph edges (AD-3): a parameter loop is the dependency-cycle rejection naming the parameters in order. setParameter adds a parameter, or changes the value of the one with that name; an invalid name is input-invalid. The Expression schema and placement switch to full expressions here in one step (13.17's literal reading ends). Commands refuse an expression that fails to evaluate (unit-mismatch, including a unitless result for a length or angle field; unresolvable-reference; division-by-zero; negative-length on a lengthSchema field, found by its quantity 'length' metadata, while a deltaSchema field may evaluate negative), including a parameter edit that would break a dependant, naming it. A loaded file reports unit-mismatch, unresolvable-reference (an unknown parameter name, ids naming the using nodes and meta for the gap), negative-length or division-by-zero, each an error, and the affected nodes and their dependants are not placed (Data Schema and Violations, 2026-11-16). The expression field and the Parameters tab call these."
verify = "Tests show a parameter change re-evaluating its dependents (gap x set to wall moving Corney's keys when wall changes); a unitless value in a length field refused as unit-mismatch; a division by zero and an unknown name refused with their kinds; a parameter edit that makes a dependant negative refused naming it; a negative value accepted in a Delta offset and refused in a Length field, and a Length evaluating to exactly 0 and to 0.001mm accepted; setParameter with an existing name changing its value, and with k-s, mm or deg refused as input-invalid; a command given an offset expression wall + 1mm placing the node from it; a parameter loop refused naming the parameters in order; a loaded file with a unit-mismatch, and one with an unknown parameter name, reporting it with the node and its dependants unplaced."
covers = ["R5"]
after = [2, 1, "13.3", "13.4"]
hitl = false
risk = "medium"

[[entry]]
id = 9
type = "story"
title = "Rename and delete parameters"
description = "renameParameter rewrites every use of the name in every expression of the design, splicing each expression's text at the name's offsets from 2's tree so the user's spacing and parentheses stay as typed, in the same command (AD-2); refused for a name another parameter has (id-taken, naming it) or an invalid one (input-invalid). deleteParameter is refused while the parameter is used (parameter-in-use, ids naming every user in design order: meta for the gap, then other parameters whose value uses it, then parts whose inputs use it, then nodes; a parameter's own value is not a use; Data Schema 2026-11-17). A rename or delete of a name the design lacks is unknown-target; a rename to its own name changes nothing. 15.2's write-back splices top-level additive literals at 2's offsets the same way."
verify = "Tests show renaming ks rewriting every expression that uses it, keeping each expression's spacing and parentheses and leaving names that only contain ks unchanged; renaming to an existing name refused as id-taken and to k-s as input-invalid; one undo restoring every rewritten expression; deleting a used parameter refused as parameter-in-use naming meta, its using parameters, its using parts and its node ids in design order; deleting an unused one removing it; renaming or deleting a name the design lacks refused as unknown-target; renaming ks to ks changing nothing."
covers = ["R5"]
after = [8]
hitl = false
risk = "medium"

