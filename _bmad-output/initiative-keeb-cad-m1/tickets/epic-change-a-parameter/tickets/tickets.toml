# Stories of epic-change-a-parameter. Table order is build order.

[[entry]]
id = 1
type = "story"
title = "Undo and redo replay patches, field edits coalesce"
description = "design's store gets undo and redo (spine AD-2, 2026-11-05): an undo entry holds its command's Immer forward and inverse patches (concatenated for a coalesced session) and the routing file reference; undo applies the inverse patches through DesignPatcher.apply, redo the forward ones, and the same patches go to the model worker; undo and redo replace the whole Committed, restoring the routing file each entry kept, which acceptDerivedFiles swaps for the one accepted at the newest entry's revision, so redo gives back routes already computed; the fingerprints file is never restored. History is linear, unbounded in M1, with no per-command inverse code. run(handle, input, { coalesce: key }) appends a command's patches to the last entry when it carries that entry's key; any other command, undo, redo or load closes the session; the entry's label is the first command's. Undo or redo on an empty stack returns unavailable. One undo restores a deleted node with everything 13.2's cascade removed with it. The undo toast and the palette read the labels."
verify = "Tests show a sequence of commands undone and redone back to byte-identical files, with the worker mirror equal to main's design after each; a rejected command leaving the design and the stack unchanged with its typed reason; one undo restoring a deleted node with everything keyed to it; three commands with one coalesce key undone as one entry labelled by the first; a command with another key, an undo, a redo and a load each closing the session; undo and redo on an empty stack returning unavailable; redo after an accepted routing file giving that file back."
covers = ["R3"]
after = ["23.3", "23.24"]
hitl = false
risk = "low"

[[entry]]
id = 2
type = "story"
title = "Parameters and expressions evaluate in resolve"
description = "The parameters section (Parameter[]: { name: ParameterName, value: Expression }; ParameterName its own schema, a letter, then letters, digits or _, never -, unique, the item's key; the unit derived from the evaluated value, never stored; ItemId widens to include ParameterName) and one hand-written parser for the AD-17 grammar: expr's parser and evaluator, called by model/worker's computeds. Standard precedence, left-associative, unary minus, parentheses, whitespace between tokens (13.17's literals unchanged: the grammar widens the stub, so every string that parsed still parses); + and - need equal units; a unitless factor or divisor keeps the quantity's unit; unit x unit and unit / unit are unit-mismatch, as is a unitless result for a length or angle field; division by zero fails evaluation. Commands refuse an expression that fails to evaluate (wrong unit, unknown name, division by zero, negative length on a lengthSchema field, found by its quantity 'length' metadata; a deltaSchema field may evaluate negative) with a model rejection, including a parameter edit that would break a dependant, naming them; a loaded file reports unit-mismatch, unresolvable-reference or negative-length (each an error) and the affected nodes are not placed. setParameter; renameParameter rewrites every use, refused for an existing or invalid name; deleteParameter refused while used, naming the using node ids and meta for the gap; a parameter loop is the dependency-cycle rejection naming the parameters in order (parameter references are graph edges, AD-3). The expression field and the Parameters tab call these; 15.2's write-back edits their top-level additive literals."
verify = "Tests show wall + gap evaluating to its sum, 2 * wall + gap following precedence, -gap negating; mm + deg refused as unit-mismatch, as are mm * mm and a unitless value in a length field; a division by zero and an unknown name refused; a parameter edit that makes a dependant negative refused naming it; a negative value accepted in a Delta offset and refused in a Length field, and a Length evaluating to exactly 0 accepted; renaming ks rewriting every expression that uses it, and renaming to an existing name or to k-s refused; deleting a used parameter refused naming its node ids and meta; a parameter loop refused naming the parameters in order; a parameter change re-evaluating its dependents; a loaded file with a unit-mismatch reporting it with the node unplaced; every literal 13.17's stub accepted still parses."
covers = ["R5"]
after = [1]
hitl = false
risk = "medium"
unknown = "Before planning, the spine says: (1) whether a loaded file's unknown parameter name reports unresolvable-reference (its Violations row defines the kind for part references and anchors only; 'unresolvable-reference for every reference' is still an Open Question), and (2) which ModelRejectionKind members this story's refusals use (an expression that fails to evaluate, a rename to an existing or invalid name, deleting a used parameter), since ModelRejectionKind lists none for 14.2."

[[entry]]
id = 3
type = "story"
title = "Groups override the default part"
description = "A group's defaultPart overrides meta.defaultPart by id; a slot with no part of its own takes its nearest ancestor's, else the design's; a reference to a design part that is not defined yet reports unresolvable-reference as a warning. The gap moved to 13.2 and key size to 13.4 (2026-11-01). 14.5's inspector edits it through layout.setDefaultPart."
verify = "A slot with no part of its own resolves the default part of its nearest ancestor group, else the design's; a group naming a design part not defined yet reports unresolvable-reference as a warning."
covers = ["R3", "R6"]
after = ["13.4"]
hitl = false
risk = "low"

[[entry]]
id = 7
type = "story"
title = "Library parts pinned by version, with setPart"
description = "A library part that isn't a blueprint (the M2 screw) pinned in library-versions by id and version; it ships its rectangle as plain data { w, h } and the parts lane outputs it as a fixed run. The setPart command (one undo step) sets a slot's part: it pins the newest released version when the part is unpinned and leaves other pins; unused pins stay; it clears slot inputs the new part doesn't mark per-slot; null clears the slot to inherit. 19.2's Part picker calls it. Cutouts, keep-outs and pins arrive with the plates and PCB stories (spine Data Schema, Recorded, not typed; 2026-11-01)."
verify = "setPart puts the M2 screw in a slot as one undo step, pinning its newest version in library-versions and leaving the key's pin; the screw's slot steps by its plain rectangle; a slot input the new part doesn't mark per-slot is cleared; setPart null makes the slot inherit again and the screw's pin stays; save and reopen are byte-identical."
covers = ["R3", "R5", "R6"]
after = ["13.18"]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Overlapping keys report overlap"
description = "The layout stage reports overlap between part envelopes, recomputed live on every resolve. The M1 envelope is the part's rectangle with no height range, typed here (spine Data Schema). An intersection deeper than 0.001 mm is an overlap error reporting the separating depth; closer than the 0.5 mm clearance, touching included, is an overlap warning reporting the gap; the clearance is a design-rules constant now, a design rule later (AD-20). Pairs are checked within a side and across the centre, fitted and stand-in slots alike, empty slots skipped; ids are side-qualified, and the violation's region holds the intersection, or the gap strip for a warning (polygon, model mm). The message comes from model's one function for the kind. 14.6 shows its violations."
verify = "Rotating Corney's thumb fan into its neighbour reports an overlap error naming both side-qualified ids, the separating depth and its region; undoing removes it. Rows on each threshold: intersections of 0.0009, 0.001 and 0.0011 mm (error only above 0.001); gaps of 0.49, 0.5 and 0.51 mm (warning below 0.5); touching caps a warning with gap 0; a stand-in overlapping a key reported; an empty slot skipped; an overlap across the centre reported."
covers = ["R6"]
after = ["13.4"]
hitl = false
risk = "low"

[[entry]]
id = 5
type = "story"
title = "Inspector and Design settings edit the selection"
description = "The inspector shows the selection's anchor, offset, chain and part fields with the expression field, mixed for differing values; a field runs its command after a typing pause and on Enter or blur, coalescing one focus session into one undo entry through 14.1's { coalesce: key }, Esc undoing it; multi-select typing is one command with many ids; a refused expression (14.2) keeps the field's last valid value. This story builds the setters in layout, each taking a list of node ids: layout.setOffset { ids, position?, rotation?, pivot? } (null clears a field to its default), layout.setArrangement { ids, arrangement, axis? }, layout.setGap { x?, y? }, layout.setDefaultPart { target: 'meta' | groupId, part | null } (null clears a group's; meta's is required), layout.setSlotInputs { ids, inputs } (refused with blueprint-input-invalid against the pinned declaration). With nothing selected, Design settings show the form read-only, gap x, gap y and the default part (key, from the NewDesign action, 13.18); a group shows a default-part override with inherits <value>; a right-half node shows read-only geometry with derived from left/<id> and the mirrored-board lock, and the Fitted toggle Fitted: left / right sets a per-side override removing the part on that side, one undo step for a multi-selection (moved from 13.8 on 2026-10-30); a slot shows its Part field, a `key ›` link to the Parts tab, and a This slot section with only the inputs its part blueprint marks per-slot, each showing `inherits <part value>` until typed (EXPERIENCE.md, 2026-11-01). Uses 13.18's part resolution, group override included."
verify = "Typing 5mm into a column offset applies after the typing pause and on Enter, and the session is one undo entry; Esc undoes it; deg on a length is refused with unit-mismatch and the field and canvas keep the last valid value; changing gap x re-spaces every chain; typing into a multi-selection is one command and one undo; setOffset with null clears to the default; setDefaultPart null on meta is refused and on a group clears to inherit; setSlotInputs with an input the part doesn't mark per-slot is refused with blueprint-input-invalid."
covers = ["R4", "R8"]
after = ["13.7", "13.8"]
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Violations on the canvas and in the panel"
description = "Layout violations from epic 13 and 14.4 show on the canvas (overlap's posted region outlined solid for an error, dashed for a warning; the dependency-cycle path drawn from its ordered ids; ●/▲ on ids) and in the violations panel (V, or the status strip counts), ordered by workspace, errors before warnings, kind, then compareId on the first id, each tagged with the revision of the seq whose issues carried it; a click switches workspace, selects the named ids, fits and flashes them; F8 / Shift+F8 step in panel order, wrap and skip stale groups; nothing is dismissed. The panel is the shared one later workspaces add their kinds to."
verify = "Rotating the thumb fan into its neighbour outlines the overlap region and lists it in the panel; clicking it selects both keys and fits them; F8 steps to it with the panel closed, and past the last violation wraps to the first; an error lists before a warning of the same workspace; a loaded cycle draws its path in id order; undo removes it from both."
covers = ["R7", "R8"]
after = [4, "13.3", "13.7"]
hitl = false
risk = "medium"
