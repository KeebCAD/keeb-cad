# Epics of initiative-keeb-cad-m1, approved 2026-10-25; re-sliced as vertical slices 2026-10-30. Table order is build order.

[[epic]]
id = 1
slug = "epic-platform-baseline"
title = "Monorepo builds and checks boundaries"
description = "The pnpm monorepo with the create-vue editor builds, one pnpm check (locally and in GitHub Actions) enforces the AD-10 dependency rules, and the empty app runs locally. The UX session (editor views, drag semantics, part and expression UI) has run and its result is adopted."
covers = []

[[epic]]
id = 2
slug = "epic-risk-spikes"
title = "Routing and geometry risks answered"
description = "Corney Island golden fixtures (Ergogen reference output for wired and wireless, plus a comparison harness) exist. The routing spike, run on Corney's Ergogen-generated PCB, has picked a browser engine that routes incrementally around fixed routes and a pre-routed module zone, or triggered the SM-3 KiCad fallback, and fixed the connection split rule. The geometry spike has confirmed makerjs against Corney's outline (or switched to clipper2) and fixed the flatten tolerance."
covers = []
after = [{ epic = 1, needs = "the monorepo scaffold the fixtures harness lives in" }]

[[epic]]
id = 23
slug = "epic-a-new-design-opens"
title = "A new design opens in the editor frame"
description = "On the locally served app, launch opens a new design in the editor frame (global chrome, workspace tabs, docked right-panel region, status strip with error and warning counts, the empty Layout hint), every command runs through the design store, the model worker mirrors the design, and a reload reopens it from browser autosave byte-identical."
covers = ["R17", "R18"]
after = [{ epic = 1, needs = "the monorepo scaffold, CI and the UX session result" }]

[[epic]]
id = 13
slug = "epic-see-corneys-keys"
title = "See Corney's keys"
description = "On the locally served app, Corney Island's left half resolves from its layout-command script (chains, explicit anchors, rotation carry, the right side of the reversible split board derived) through blueprint parts in the model worker, the user adds and deletes groups, slots and keys from a blank canvas, and both halves are drawn on the Layout canvas with viewport and selection inside the editor frame."
covers = ["R1", "R2", "R4", "R17"]
after = [{ epic = 1, needs = "the monorepo scaffold, CI and the UX session result" }, { epic = 23, needs = "the design store, the design file, the model worker, autosave and the editor frame" }]

[[epic]]
id = 14
slug = "epic-change-a-parameter"
title = "Change a parameter"
description = "The user edits the gap, a slot's key size, default parts or a parameter in the expression field (inspector, Design settings, Parameters), sees Corney's keys move live, gets overlap in the violations panel, and undoes the edit as one registered command."
covers = ["R3", "R17", "R18"]
after = [{ epic = 23, needs = "the design store, the design file and the editor frame" }, { epic = 13, needs = "Corney's script and the Layout canvas" }]

[[epic]]
id = 16
slug = "epic-keep-my-work"
title = "Keep my work"
description = "The user saves to a file and opens it in Chromium and Firefox from the File menu and Start screen, older files migrate and newer or broken ones are refused safely, and a second tab opens read-only until it takes over; Save to file keeps the design and its id."
covers = ["R5", "R18"]
after = [{ epic = 23, needs = "the design file and autosave" }, { epic = 14, needs = "parameters and the design store" }]

[[epic]]
id = 15
slug = "epic-drag-keys"
title = "Drag keys"
description = "The user drags, rotates and nudges keys and groups by the chain rule, re-anchors with the anchor picker keeping the node in place (anchor cycles rejected and shown), and each drop or nudge burst is one undo step; the UX assumptions are reviewed after the Corney layout rebuild."
covers = ["R1", "R2", "R18"]
after = [{ epic = 14, needs = "the design store, undo and the inspector" }, { epic = 13, needs = "resolved keys and the Layout canvas" }, { epic = 16, needs = "the Toast, for the stale-drop toast" }]

[[epic]]
id = 17
slug = "epic-outline-follows-the-keys"
title = "Outline follows the keys"
description = "Derived shapes fit each group of Corney's keys and their parts with a margin, join into the outline, refit live as keys move, and report fit-violated, drawn on the Outline canvas. Opens with a spike: can derived shapes reproduce Corney's outline as the same shape within ±0.05 mm?"
covers = ["R7", "R17"]
after = [{ epic = 15, needs = "live key moves to refit against" }]

[[epic]]
id = 18
slug = "epic-draw-custom-shapes"
title = "Draw custom shapes"
description = "The user draws shapes from primitives, booleans and offset, with vertices anchored to keys, groups, construction points or other vertices, and alterations on top; LambBT's circle subtraction is expressible, and Corney's exact outline is drawn if the opening spike of 'outline follows the keys' says derived shapes can't match it."
covers = ["R6", "R7"]
after = [{ epic = 17, needs = "the outline and the Outline canvas" }]

[[epic]]
id = 19
slug = "epic-plates-to-dxf"
title = "Plates to DXF"
description = "Corney's switch plate, backplate and MCU cover are shapes minus part cutouts (Choc v2 switch, M2 screws from the part schema, placed with the Part picker), update live as parts move, and export as DXF and SVG through the export registry, which reports each export available or blocked."
covers = ["R8", "R9", "R10"]
after = [{ epic = 18, needs = "drawn shapes for the MCU cover and any exact outline" }, { epic = 23, needs = "the design file and the design store" }, { epic = 14, needs = "the part schema and the inspector" }]

[[epic]]
id = 6
slug = "epic-parts-and-pcb"
title = "Footprints on the PCB"
description = "The rest of Corney Island's library parts and footprints and Corney's design-local key part place every footprint and keep-out on the PCB, whose edge is composed from the outline; isolated part mode edits a design-local part's components and tracks, and changing the key's part updates every key's footprints; part cutouts move with their part in plate, PCB and case; the PCB follows key moves live and exports a KiCad 10 project as the escape hatch."
covers = ["R3", "R8", "R9", "R11", "R13"]
after = [{ epic = 19, needs = "the part schema and part cutouts" }]

[[epic]]
id = 20
slug = "epic-nets-and-matrix"
title = "Nets and matrix"
description = "The netlist, matrix and connections are derived from layout and parts, with matrix row/column, MCU pin and LED-order overrides, and the cross-stage test shows the firmware matrix equals the PCB nets."
covers = ["R11"]
after = [{ epic = 6, needs = "placed footprints and pin roles" }]

[[epic]]
id = 9
slug = "epic-firmware-and-keymap"
title = "Firmware and keymap"
description = "Corney Island's own keymap is authored in keeb-cad, and a ZMK configuration builds for the wired design, with RGB, once prd §8 Q2 (wired split) is decided."
covers = ["R15", "R16"]
after = [{ epic = 20, needs = "the netlist and matrix" }]

[[epic]]
id = 7
slug = "epic-routing-and-fab"
title = "Route and fab"
description = "The wired design routes incrementally in a browser worker with saved routes and Reroute, passes the single DRC with design rules, and exports PCB and plate gerbers + drill that pass the fab's checks; unrouted connections and DRC violations are always shown. Background stages run in workers with progress and cancel, and stale results are marked."
covers = ["R10", "R12", "R13", "R17"]
after = [{ epic = 20, needs = "connections" }, { epic = 23, needs = "the model worker and its protocol" }]

[[epic]]
id = 8
slug = "epic-tray-case"
title = "Tray in 3D"
description = "The tray build style builds Corney Island's case in the background from the PCB edge, part case cutouts and its settings, shows it in the 3D viewer, re-derives it when a setting changes, and exports STL and STEP."
covers = ["R9", "R14"]
after = [{ epic = 6, needs = "the PCB edge and part case cutouts" }, { epic = 7, needs = "the background worker harness" }]

[[epic]]
id = 21
slug = "epic-own-case-operations"
title = "My own case operations"
description = "The user adds pockets and cuts on top of the tray as the design's own case operations, applied after the style; they follow the layout, and every blueprint version is pinned: a version never changes, and an app operation fix that changes the saved case is shown and accepted."
covers = ["R14"]
after = [{ epic = 8, needs = "the tray style and the case lane's operations" }]

[[epic]]
id = 22
slug = "epic-wireless-copy"
title = "Wireless copy"
description = "Copy design makes Corney Island wireless from wired with provenance; its different parts and positions follow through PCB, routing, case and a building ZMK config."
covers = ["R5", "R8"]
after = [{ epic = 21, needs = "the wired case" }, { epic = 9, needs = "the wired ZMK config" }, { epic = 7, needs = "the wired routing and fab path" }, { epic = 16, needs = "Save to file and the File menu" }]

[[epic]]
id = 10
slug = "epic-milestone-acceptance"
title = "Milestone accepted"
description = "On the locally served static build, Corney Island is rebuilt from a blank canvas and SM-1 to SM-5 pass, including the golden comparisons with Ergogen within ±0.05 mm and the edit script with zero manual fix-ups."
covers = ["R17"]
after = [{ epic = 22, needs = "both designs complete" }, { epic = 2, needs = "the Ergogen golden fixtures and comparison harness" }]

