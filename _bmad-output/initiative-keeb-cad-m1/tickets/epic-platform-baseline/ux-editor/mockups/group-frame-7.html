<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group frame tab</title>
<script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.js"></script>
<style>
  :root {
    --chrome: #292c3c; --text: #c6d0f5; --muted: #a5adce; --canvas: #414559; --grid: #51576d;
    --key-body: #626880; --key-edge: #949cbb; --key-top: #949cbb; --frame: #949cbb;
    --selection: #ca9ee6; --crust: #232634; --hover-key: #babbf1;
  }
  body { margin: 0; background: var(--chrome); color: var(--text); font: 14px/1.45 "JetBrains Mono", ui-monospace, monospace; }
  header { padding: 16px 20px 4px; max-width: 120ch; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  header p { margin: 4px 0 0; color: var(--muted); }
  .opt { padding: 12px 20px 8px; }
  .opt h2 { font-size: 14px; margin: 0 0 8px; }
  .row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 1300px) { .row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  figure { margin: 0; background: var(--canvas); border-radius: 8px; overflow: hidden; }
  figcaption { background: var(--chrome); padding: 6px 10px; border-top: 1px solid var(--grid); color: var(--muted); font-size: 13px; }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<header>
  <h1>Where does the ⠿ tab sit? (shape C, margin = key gap = 1 mm)</h1>
  <p>Moments: pointer on <code>ring-home</code>, <code>matrix</code> selected, pointer on <code>thumb-mid</code>, and <code>thumbs</code> selected after its group is rotated 25° about <code>thumb-near</code> (J2 rotates it 5°; 25° makes the difference visible).</p>
</header>
<div id="opts"></div>
<script>
const S = 2.6, M = 1, X0 = 80, Y0 = -36, VW = 160, VH = 112, CL = 1000
const W = VW * S, H = VH * S
const key = (id, x, y, r = 0, w = 18) => ({ id, x, y, r, w, h: 18 })
const col = (id, x, y0) => ({ id, keys: ['bottom','home','top'].map((row, i) => key(`${id}-${row}`, x, y0 + 19 * i)) })
const thumbKeys = [key('thumb-near', 166.5, -114.875), key('thumb-mid', 187.5, -117.625, -15), key('thumb-far', 209.7468058, -121.3891576, 60, 27)]
function rotatedAbout(keys, deg, [px, py]) {
  const a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a)
  return keys.map(k => ({ ...k, x: px + (k.x - px) * c - (k.y - py) * s, y: py + (k.x - px) * s + (k.y - py) * c, r: k.r + deg }))
}
function makeTree(thumbRot) {
  return { id: 'left', children: [
    { id: 'matrix', children: [
      col('outer', 100, -100), col('pinky', 119, -100), col('ring', 138, -95.25),
      col('middle', 157, -92.875), col('index', 176, -95.25), col('inner', 195, -97.625),
    ] },
    { id: 'thumbs', rot: thumbRot, pivot: [166.5, -114.875], keys: thumbRot ? rotatedAbout(thumbKeys, thumbRot, [166.5, -114.875]) : thumbKeys },
  ] }
}
const sx = x => (x - X0) * S, sy = y => (Y0 - y) * S
function corners(k) {
  const a = k.r * Math.PI / 180, c = Math.cos(a), s = Math.sin(a), u0 = k.w / 2, v0 = k.h / 2
  return [[-u0,-v0],[u0,-v0],[u0,v0],[-u0,v0]].map(([u,v]) => [k.x + u*c - v*s, k.y + u*s + v*c])
}
const toPath = poly => poly.map(([x,y]) => ({ X: Math.round(x*CL), Y: Math.round(y*CL) }))
function shapeC(polys) {
  const co = new ClipperLib.ClipperOffset(2, 0.02 * CL), off = new ClipperLib.Paths()
  co.AddPaths(polys.map(toPath), ClipperLib.JoinType.jtRound, ClipperLib.EndType.etClosedPolygon); co.Execute(off, M * CL)
  const c = new ClipperLib.Clipper(), out = new ClipperLib.Paths()
  c.AddPaths(off, ClipperLib.PolyType.ptSubject, true)
  c.Execute(ClipperLib.ClipType.ctUnion, out, ClipperLib.PolyFillType.pftNonZero, ClipperLib.PolyFillType.pftNonZero)
  return out.map(p => p.map(q => [q.X/CL, q.Y/CL]))
}
const keysOf = g => (g.keys || []).concat(...(g.children || []).map(keysOf))
const find = (g, id) => g.id === id ? g : (g.children || []).map(c => find(c, id)).find(Boolean)
function frameOf(g) {
  const sources = (g.keys || []).map(corners)
  for (const c of g.children || []) sources.push(...frameOf(c))
  return shapeC(sources)
}
// Each placement returns [x, y, angle] in model space for the tab's bottom-left corner.
const placements = [
  ['a · Above the frame’s highest point, left end, horizontal', (pts) => {
    const top = Math.max(...pts.map(p => p[1])); return [Math.min(...pts.filter(p => p[1] > top - 0.6).map(p => p[0])), top, 0] }],
  ['b · Top-left corner of the frame’s bounding box, horizontal', (pts) => [Math.min(...pts.map(p => p[0])), Math.max(...pts.map(p => p[1])), 0]],
  ['c · Along the frame’s top edge in the group’s own frame, rotated with the group', (pts, g) => {
    const rot = g.rot || 0, [px, py] = g.pivot || [0, 0], a = -rot * Math.PI / 180, c = Math.cos(a), s = Math.sin(a)
    const local = pts.map(([x, y]) => [px + (x - px) * c - (y - py) * s, py + (x - px) * s + (y - py) * c])
    const top = Math.max(...local.map(p => p[1])), left = Math.min(...local.filter(p => p[1] > top - 0.6).map(p => p[0]))
    const b = rot * Math.PI / 180
    return [px + (left - px) * Math.cos(b) - (top - py) * Math.sin(b), py + (left - px) * Math.sin(b) + (top - py) * Math.cos(b), rot] }],
]
const moments = [
  ['pointer on ring-home', { group: 'ring', sel: false, hoverKey: 'ring-home', rot: 0 }],
  ['matrix selected', { group: 'matrix', sel: true, rot: 0 }],
  ['pointer on thumb-mid', { group: 'thumbs', sel: false, hoverKey: 'thumb-mid', rot: 0 }],
  ['thumbs selected, group rotated 25°', { group: 'thumbs', sel: true, rot: 25 }],
]
const ns = 'http://www.w3.org/2000/svg'
const el = (n, a, p) => { const e = document.createElementNS(ns, n); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e }
const d = poly => 'M' + poly.map(([x,y]) => `${sx(x).toFixed(1)},${sy(y).toFixed(1)}`).join('L') + 'Z'
let n = 0
for (const [title, place] of placements) {
  const sec = document.createElement('section'); sec.className = 'opt'
  sec.innerHTML = `<h2>${title}</h2>`
  const row = document.createElement('div'); row.className = 'row'; sec.appendChild(row)
  for (const [label, m] of moments) {
    const tree = makeTree(m.rot), g = find(tree, m.group)
    const fig = document.createElement('figure')
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}` }, fig)
    const pat = el('pattern', { id: 'p'+(++n), width: 19*S/2, height: 19*S/2, patternUnits: 'userSpaceOnUse' }, el('defs', {}, svg))
    el('path', { d: `M ${19*S/2} 0 L 0 0 0 ${19*S/2}`, fill: 'none', stroke: 'var(--grid)', 'stroke-width': 1 }, pat)
    el('rect', { width: W, height: H, fill: `url(#p${n})` }, svg)
    const polys = frameOf(g)
    for (const p of polys) el('path', { d: d(p), fill: 'none', stroke: m.sel ? 'var(--selection)' : 'var(--frame)', 'stroke-width': m.sel ? 2 : 1, 'stroke-dasharray': '5 3' }, svg)
    for (const k of keysOf(tree)) {
      const hov = k.id === m.hoverKey
      const kg = el('g', { transform: `translate(${sx(k.x)},${sy(k.y)}) rotate(${-k.r})` }, svg)
      el('rect', { x: -(k.w/2 - 0.25)*S, y: -8.25*S, width: (k.w - 0.5)*S, height: 16.5*S, rx: 1.5*S, fill: 'var(--key-body)', stroke: hov ? 'var(--hover-key)' : 'var(--key-edge)', 'stroke-width': hov ? 2 : 1 }, kg)
      el('rect', { x: -(k.w/2 - 2.5)*S, y: -6.5*S, width: (k.w - 5)*S, height: 11*S, rx: 1.2*S, fill: 'var(--key-top)' }, kg)
    }
    const [tx, ty, ang] = place(polys.flat(), g)
    const tg = el('g', { transform: `translate(${sx(tx)},${sy(ty)}) rotate(${-ang}) translate(0,-14)` }, svg)
    el('rect', { width: 18 + m.group.length * 6, height: 14, rx: 3, fill: m.sel ? 'var(--selection)' : 'var(--canvas)', stroke: m.sel ? 'var(--selection)' : 'var(--frame)', 'stroke-width': 1 }, tg)
    el('text', { x: 4, y: 10.5, fill: m.sel ? 'var(--crust)' : 'var(--text)', 'font-size': 10 }, tg).textContent = '⠿ ' + m.group
    const cap = document.createElement('figcaption'); cap.textContent = label
    fig.appendChild(cap); row.appendChild(fig)
  }
  document.getElementById('opts').appendChild(sec)
}
</script>
</body>
</html>
