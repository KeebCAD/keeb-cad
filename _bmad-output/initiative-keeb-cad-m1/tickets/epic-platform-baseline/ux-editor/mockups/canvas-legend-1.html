<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas legends</title>
<style>
  :root {
    --canvas: #414559; --key-body: #626880; --key-edge: #949cbb; --key-top: #949cbb;
    --legend: #232634; --label-bg: #303446; --label-text: #c6d0f5; --selection: #ca9ee6;
    --group-border: #949cbb; --text: #c6d0f5; --muted: #a5adce; --anchor: #81c8be;
  }
  body { margin: 0; padding: 16px; background: #303446; color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.lead { margin: 0 0 16px; color: var(--muted); max-width: 70ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
  figure { margin: 0; background: #292c3c; border-radius: 6px; padding: 12px; }
  figcaption { margin-bottom: 8px; }
  figcaption b { display: block; }
  figcaption span { color: var(--muted); font-size: 13px; }
  svg { width: 100%; height: auto; display: block; background: var(--canvas); border-radius: 4px; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
</style>
</head>
<body>
<h1>Canvas legends: slot ids on Corney's left half</h1>
<p class="lead">Same keys in every panel, at the zoom where F fits the whole board (a 1u key is about 50 px). The pointer rests on <span class="mono">matrix-ring-home</span>; <span class="mono">thumbfan-mid-home</span> is selected.</p>
<div class="grid">
  <figure><figcaption><b>A · Today</b><span>Every slot id on its key at all zooms; long ids overrun their neighbours.</span></figcaption><svg id="a" viewBox="0 0 440 300"></svg></figure>
  <figure><figcaption><b>B · On demand</b><span>No ids at rest. The pointed and the selected key show their id in a label just above the key.</span></figcaption><svg id="b" viewBox="0 0 440 300"></svg></figure>
  <figure><figcaption><b>C · On demand, plus when it fits (fit zoom)</b><span>As B, and an id is drawn on its key only when it fits the top face at the current zoom. At fit zoom none fit, so this looks like B.</span></figcaption><svg id="c" viewBox="0 0 440 300"></svg></figure>
  <figure><figcaption><b>C · Same rule, zoomed in 3.5×</b><span>Zoomed in, each id that fits its top face appears on it; ones that don't stay hidden.</span></figcaption><svg id="c2" viewBox="0 0 440 300"></svg></figure>
</div>
<script>
const cols = [
  { name: 'outer', x: 0, dy: 18 }, { name: 'pinky', x: 1, dy: 18 }, { name: 'ring', x: 2, dy: 6 },
  { name: 'middle', x: 3, dy: 0 }, { name: 'index', x: 4, dy: 6 }, { name: 'inner', x: 5, dy: 10 },
];
const rows = ['top', 'home', 'bottom'];
const U = 48, GAP = 6;
function keys() {
  const out = [];
  for (const c of cols) rows.forEach((r, i) => out.push({
    id: `matrix-${c.name}-${r}`, x: 30 + c.x * (U + GAP), y: 40 + c.dy + i * (U + GAP), rot: 0,
  }));
  out.push({ id: 'thumbfan-near-home', x: 210, y: 215, rot: 0 });
  out.push({ id: 'thumbfan-mid-home', x: 265, y: 222, rot: -12 });
  out.push({ id: 'thumbfan-far-home', x: 322, y: 236, rot: -26 });
  return out;
}
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
const CHAR = 6.6; // JetBrains Mono at 11px
function label(svg, k, scale) {
  const w = k.id.length * CHAR + 12, cx = (k.x + U / 2) * scale, top = k.y * scale - 6;
  const g = el('g', {}, svg);
  el('rect', { x: cx - w / 2, y: top - 18, width: w, height: 18, rx: 3, fill: 'var(--label-bg)', stroke: 'var(--key-edge)', 'stroke-width': 1 }, g);
  el('text', { x: cx, y: top - 5, 'text-anchor': 'middle', fill: 'var(--label-text)', 'font-size': 11, class: 'mono' }, g).textContent = k.id;
}
function draw(id, mode, scale = 1, origin = [0, 0]) {
  const svg = document.getElementById(id);
  const root = el('g', { transform: `translate(${-origin[0]} ${-origin[1]})` }, svg);
  const hovered = 'matrix-ring-home', selected = 'thumbfan-mid-home';
  const ks = keys();
  for (const k of ks) {
    const s = U * scale, x = k.x * scale, y = k.y * scale;
    const g = el('g', { transform: `rotate(${k.rot} ${x + s / 2} ${y + s / 2})` }, root);
    el('rect', { x, y, width: s, height: s, rx: 3, fill: 'var(--key-body)', stroke: k.id === selected ? 'var(--selection)' : 'var(--key-edge)', 'stroke-width': k.id === selected ? 2 : 1 }, g);
    const inset = 6 * scale;
    el('rect', { x: x + inset, y: y + inset * 0.6, width: s - 2 * inset, height: s - 2 * inset, rx: 2, fill: 'var(--key-top)' }, g);
    const face = s - 2 * inset - 4;
    const fits = k.id.length * CHAR <= face;
    const showOnKey = mode === 'a' || (mode === 'c' && fits);
    if (showOnKey) el('text', { x: x + s / 2, y: y + s / 2 + 3, 'text-anchor': 'middle', fill: 'var(--legend)', 'font-size': 11, class: 'mono' }, g).textContent = k.id;
  }
  if (mode !== 'a') for (const k of ks) if (k.id === hovered || k.id === selected) {
    if (!(mode === 'c' && k.id.length * CHAR <= U * scale - 12 * scale - 4)) label(root, k, scale);
  }
}
draw('a', 'a'); draw('b', 'b'); draw('c', 'c');
draw('c2', 'c', 3.5, [300, 200]);
</script>
</body>
</html>
