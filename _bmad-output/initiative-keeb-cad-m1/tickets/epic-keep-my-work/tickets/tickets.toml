[[entry]]
id = 1
type = "story"
title = "Old files migrate, newer and broken ones are refused safely"
description = "Loading migrates older format versions forward through migrateBundle's one migration chain, which is injectable: the real chain stays empty until the first public preview (format-version stays 1, AD-8), so this story's tests inject a test-only chain (current format 2, one step from 1) with a format-1 fixture. A migrated bundle reports MigratedBundle's migratedFrom, shown as the timed toast 'Upgraded from format N'; a newer format is not opened: format-too-new (with the version found) shows a persistent banner (role=alert) asking the user to reload to get the newer app; a migration whose step throws reports migration-failed in a persistent banner naming the failure and never overwrites the file; a design file that isn't valid KDL reports file-unreadable with its line and column, and one failing its schema design-invalid with the path from the design root, neither replacing the open design; a routing or fingerprints file that is unreadable or invalid is emptied, not refused, and 23.5's load flow shows a timed toast naming the saved file reset ('Saved routes couldn't be read and were reset'); a load whose reset save fails shows the save's error (storage-unavailable or quota-exceeded) and the open design stays open (spine AD-13, 2026-11-07); 23.7's fallback new design at launch shows a persistent banner naming the load failure that caused it ('Couldn't open your last design (<failure>); this is a new one.'). Builds the Banner and Toast (component ownership)."
verify = "With the injected test-only chain (current 2): a format-1 fixture opens with migratedFrom 1, shows the 'Upgraded from format 1' toast and saves as format 2; a chain whose step throws gives migration-failed in the banner with the stored file unchanged; a format-3 file gives format-too-new with found 3 in the banner and the open design unchanged; a corrupt file reports its line with the open design unchanged; a load that empties an unreadable routing file shows the reset toast; a launch fallback shows the banner naming its failure; a load whose reset save is refused for space shows quota-exceeded, and one whose storage request fails shows storage-unavailable, each with the open design unchanged."
covers = ["R2"]
after = ["14.2"]
hitl = false
risk = "low"
unknown = "Open question (left to UX by the spine, 2026-11-07; Sally, EXPERIENCE.md): how is a failed reset save shown while a design is open, the timed save-failed toast or the persistent autosave-failed banner? And at launch, does the 'Couldn't open your last design' banner name the save's error? Sofia's pick: the persistent banner in both cases, because the design the user asked for did not open and nothing retries it."

[[entry]]
id = 4
type = "story"
title = "Undo and redo from the keys and the top bar"
description = "The editor's undo and redo (EXPERIENCE.md › Global chrome and Toast): mod+Z undoes and mod+Shift+Z redoes through 23.19's shortcut registry, the top bar's undo and redo buttons do the same, each disabled while the store's undo or redo is unavailable, and each shows 16.1's toast 'Undid: <command label>' or 'Redid: <command label>' with the label 14.1's entry carries (the first command's for a coalesced session). Undo and redo are the store's (14.1); this story only invokes them, on 23.8's top bar. Assumption (Sofia, 2026-11-07): the redo toast reads 'Redid: <command label>', mirroring EXPERIENCE.md's 'Undid: <command label>', which names no redo text."
verify = "In Vitest browser mode in Chromium and Firefox (AGENTS.md's end-to-end bar: undo is reversible and crosses no boundary a lower level can't fake): after a test command, mod+Z restores the design and shows 'Undid: <its label>', and mod+Shift+Z re-applies it and shows 'Redid: <its label>'; the top bar's buttons do the same; on an empty stack both are disabled and the keys change nothing; a coalesced field session undoes as one step labelled by its first command."
covers = ["R2"]
after = [1, "14.1", "23.19", "23.8"]
hitl = false
risk = "low"

[[entry]]
id = 2
type = "story"
title = "Save and open files in Chromium and Firefox"
description = "storage's file backend. On disk a design bundle is one zip, <slugified name>.keeb, holding design.kdl, routing.kdl, fingerprints.kdl and assets/<hash> (AD-13); the zip library gets its Stack row when this story is planned. In Chromium the first save asks for a location through the File System Access API and later saves write in place; the file handle is kept in IndexedDB per design, and after a reload the first Save calls queryPermission() and, on 'prompt', requestPermission() inside that click; a refused permission fails the save with its reason, stays unsaved and offers the picker; a cancelled picker does nothing. In Firefox each save downloads <slugified name>.rev<short hash>.keeb. Open is an action that reads the picked bundle through 23.5's load flow and binds later saves to the opened file. The design exposes its save state: saved when the current revision equals the last revision written to the file, else unsaved changes; in Firefox, saved to browser with the last downloaded revision; a failed save reports save failed with its reason and stays unsaved. The Start screen lists stored designs through 23.5's listDesigns; opening a file whose design is stored at another revision opens the file's revision and keeps the stored one as a version, never overwriting it. listVersions keeps named points until the design is deleted (file, saved, switch, migration, reset, and copy from 22.1) plus the last 20 autosave versions, each with its reason, pruning only autosave versions under storage pressure (AD-13). Every save writes the whole bundle atomically: the design file at its revision plus the latest accepted routing and fingerprints files, each keeping its own revision tag, and the assets. No network call. The File menu (keep my work, to plan) calls it. A person confirms one real Chromium save and one Firefox download."
verify = "Playwright runs in both browsers: the Chromium save writes a .keeb zip in place (picker stubbed) and the Firefox save downloads <slugified name>.rev<short hash>.keeb, and reopening each gives the same bytes in each of its files; after Open, Save writes to the opened file; a cancelled picker changes nothing; in a real Chromium, a reload then Save asks for permission inside the click and writes to the same file, and a refused permission leaves the design unsaved with the picker offered; a person confirms one real Chromium save and one Firefox download; a test with 25 autosaves and one file open lists the file version plus the last 20 autosaves, each with its reason."
covers = ["R8"]
after = ["23.3"]
hitl = true
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "One tab edits, others are read-only until they take over"
description = "One tab edits a design at a time: a Web Lock named by the design id marks the editing tab, the only one that saves. A second tab opening the same design gets it read-only, through a read-only mode built here, and never writes any file of its bundle: authored-section commands, undo, redo, Reroute, Accept output change and version switch are disabled; New design, Open, Copy design, export and Save to file stay. When the browser frees the lock (the editing tab closes or crashes), the read-only tab says so and edits only after the user's Take over. Take over reloads the stored bundle through 23.5's load flow before writing; the demoted tab flushes its last pending commit, stops autosave (both its subscriptions), drops an open expression session or nudge burst without committing it and its in-flight background results, and becomes read-only (AD-13). Builds the read-only banner ('Read-only — this design is open for editing in another tab.') with the Take over editing action."
verify = "A two-page Playwright test: the second page opens read-only, with undo, redo and authored-section commands refused, New design, Open, Copy design, export and Save to file available, and nothing written to the bundle; after Take over the second page reloads the stored bundle and edits, and the first page is read-only with its last pending commit saved, its open nudge burst dropped uncommitted and its pending background result dropped; closing the editing page frees the lock, and the read-only page says so and stays read-only until Take over."
covers = ["R9"]
after = [1, 2, 4]
hitl = false
risk = "medium"
