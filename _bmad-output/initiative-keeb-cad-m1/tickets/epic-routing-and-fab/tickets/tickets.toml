[[entry]]
id = 1
type = "story"
title = "Background stages run in workers with progress and cancel"
description = "pipeline runs background stages in Web Workers at committed revisions (every revision, since nothing in progress reaches the design, AD-2), handing each its input slice over its MessageChannel port, newest seq only. They report progress { done, total } (the editor shows % or N/M per stage, 7.2), partial { seq, output } and failed { seq, message } (StageProgress, StagePartial, StageFailed). A newer commit cancels a running stage only when its input-slice hash changed; otherwise it runs on and its result is tagged with the latest seq. 'Waiting for edit to finish' is display-only, shown while an expression field's focus session, a nudge burst or a drag is open; only routing defers, its drop and reroute running when the session ends (AD-12). Proven with a test-only stage declared, with its input-slice type, in pipeline's spec files (nothing in schema or the spine; a real stage's slice is typed in the spine's Data Schema before its story); case and routing plug in later. Adds a test page hosting the packages, which stories 8 and 9 reuse (the Firefox Playwright project comes from 23.7)."
verify = "In Chromium and Firefox: a slow test stage reports rising progress and a partial result tagged with its seq; a new commit that changes its input slice cancels it and restarts it on the new revision, and one that leaves its input-slice hash unchanged lets it run on, its result tagged with the latest seq; a throwing stage reports failed with its message while the last good output stays marked stale; while a nudge burst is open its state reads waiting for edit to finish."
covers = ["R6"]
after = ["23.4"]
hitl = false
risk = "high"

[[entry]]
id = 2
type = "story"
title = "Background outputs tagged by input slice"
description = "Moved to epic-routing-and-fab at epic-see-corneys-keys refinement (2026-10-30): background outputs tagged and cached by input-slice hash (AD-11); the Tab badge and status-strip output-state entries: a tab's badge shows the worst state over the stages AD-11's workspace table gives the tab, failed > stale > rebuilding N% or routing N/M > waiting for edit to finish > current; and the fingerprints file (spine AD-11): one input-slice hash and output hash per build entry and per blueprint design part, computed by pipeline, numbers in an output rounded to 6 decimals before hashing, with the Accept output change action (added 2026-11-01), which accepts every pending change at once and shows how many and which ids; an accepted file reaches design through acceptDerivedFiles and autosaves on its accept event (23.5). Revise in place when that epic is refined."
verify = "With a test background stage: an input-slice change marks its output stale, and the last good output is shown stale while it recomputes; a tab with one failed and one stale stage shows failed; two outputs differing only past the 6th decimal give the same output hash; Accept output change with two pending changes shows 2 and both ids, accepts both and autosaves once."
covers = []
after = [1]
hitl = false
risk = "medium"
