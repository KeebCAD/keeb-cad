description = "Moved to epic-routing-and-fab at epic-see-corneys-keys refinement (2026-10-30): background outputs tagged and cached by input-slice hash (AD-11), and the Tab badge and status-strip output-state entries (current, waiting for edit to finish, stale). Revise in place when that epic is refined."
verify = "With a test background stage, an input-slice change marks its output stale until recomputed, and a cache hit from an older input slice is reported stale."
covers = []
