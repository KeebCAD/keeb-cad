hitl = true
risk = "high"

[[entry]]
id = 17
type = "story"
title = "The sandbox runs a blueprint lane"
description = "Adds @keeb-cad/blueprint (AD-10) per the blueprints spine. The host on quickjs-wasi 3.6.3, pinned exactly (BP-2), with the pending-job contract test. Determinism (BP-3): one factory per pinned version, a fresh instance per run; the allow-listed global scope (ECMAScript built-ins minus Date, Math.random, WeakRef, FinalizationRegistry, plus the frozen blueprint API), frozen, strict mode; maxStackSize 256 KiB; a fixed WASI clock and random source; the try/catch boundary returning { failed } cut at 500 characters; strict JSON result decode. Budgets (BP-4): 100 interrupt-handler steps and a 64 MiB memoryLimit, each pinned by a test. The lane contract (BP-8): args { inputs, pulls, queries }, op holding only that stage's operations, results { outputs, problems } checked against each output's name and count; every host call through one host-call wrapper returning one JSON string (BP-1). The VM lifecycle (BP-9): one VM per pinned version with its uses' factories, a pool per worker, one handle table per run freed at its end. Nesting (BP-6): use() in the caller's VM, lane and handle table. The blueprint API version and blueprint-api-too-new; lane-failed with its causes, unavailable uncached (BP-5); the data-blueprint interpreter imports expr's evaluator (AD-17); expr is stubbed here with number literals with their unit ('19mm', '-15deg'; no parameters), which schema's Expression calls from 13.2 (spine 2026-11-03), and 14.2 fills in the grammar. From the spine's Deferred: out-of-memory results that depend on garbage from earlier runs, tagging handles as 2D or 3D, and the spikes' timings and memory probes re-run in a browser worker on AC before any number becomes a budget. Fences: blueprint imports only geometry, expr, schema and hashing, only blueprint imports quickjs-wasi, blueprint/authoring imports nothing at run time; each with a violation fixture; run tooling/verify-checks.sh."
verify = "Tests in Chromium and Firefox, per BP's Verification row: a stateful test blueprint gives the same output for the same input; a runaway stops at the step budget; an allocation loop fails out of memory, typed; unbounded recursion fails typed; the global allow-list walk matches; a throwing getter never runs on the host; a nested blueprint can't see its caller; an output breaking its declared count fails the lane; a newer API is not run and reports blueprint-api-too-new; the pending-job contract test; each new fence rejects its fixture; the timings re-run is recorded beside the spike verdict; the expr stub parses '19mm' and '-15deg'."
covers = []
after = [16]
hitl = false
risk = "high"

[[entry]]
id = 21
type = "story"
title = "Library blueprints build and run in the model worker"
description = "Library blueprints are TS sources in library/blueprints-src, each one export default defineBlueprint({ id, version, inputs, uses, lanes }) whose declaration types args and op (BP-7). The library build type-checks each, validates its declaration with schema's, and splits it into a self-contained script (bundled, no imports, evaluating to { lanes: { <stage>: run } }) and the declaration as JSON, with a round-trip test of lane names. Declarations ship from library's main subpath, scripts only from library/worker, which only the model and case worker entries import; main never carries blueprint code, even as text. The lane runner lives in blueprint/worker: the model worker's entry hands the compiled scripts to story 17's VM pool, which it fills in the pause between applying patches and running stages; each stage passes its operation table and handle converter as arguments (runner.runLane(lane, { operations, convertHandle }, inputs)); the runner owns the per-run lane cache, memory-only, keyed per BP-5 (stage and version, blueprint version, the transitive closure of pinned uses, each argument's canonical hash). Fences: library/blueprints-src imports only blueprint/authoring; only the worker entries import library/worker; each with a violation fixture; run tooling/verify-checks.sh."
verify = "Tests: a test library blueprint builds into a script and declaration whose lane names match; a declaration that fails schema's validation fails the build; identical lane runs share one cache entry and a changed argument misses; a deterministic failure is cached and an unavailable lane is not; the main bundle holds no blueprint script; each new fence rejects its fixture."
covers = []
after = [17]
hitl = false
risk = "high"

[[entry]]
id = 18
type = "story"
title = "A new design holds a default key part"
description = "schema gets the library-versions and parts sections in their AD-8 positions, meta.defaultPart (required) and DesignPart { type: 'blueprint' } with BlueprintInputs (spine Data Schema); library ships lib:blueprint/choc-key v1, a Choc v2 key at 1u whose one output is its rectangle (the keycap), plain { w, h } centred on the slot's frame; no envelope (typed before 14.4) and no footprints yet; the NewDesign action's fresh design holds the design part key applying it, pinned in library-versions, with meta.defaultPart set (EXPERIENCE.md, decided 2026-11-01); the parts lane runs in the model worker (model/worker, the script from library/worker through blueprint/worker's lane runner (story 21); main reads declarations only) and resolves each slot's part to its rectangle through model's one slot -> part run computed (own part, else the nearest group's defaultPart, else meta.defaultPart, 'else' meaning unset; plus per-slot inputs), each run posted once with id '<part id>@<hash of its resolved inputs>' (Data Schema PartsOutput); a slot whose set reference doesn't resolve, or resolves with no run output (blueprint-api-too-new, a first run failing, unavailable), is a stand-in stepping by the next level's rectangle, else the app-defined 'stand-in' run, and reports unresolvable-reference (AD-5); deleting the design part or library-versions entry that meta.defaultPart names is rejected (AD-2), adding its model rejection kind; this story also codes ref(kind), adds LibraryId to ItemId and tags a quantity input value { type: 'quantity'; value } (spine 2026-11-03). Fingerprints arrive with 7.2; until then the bundle's fingerprints file is empty (epic Decision 2026-11-02)."
verify = "A new design has key as its default part, pinned at version 1; a slot resolves its rectangle from it; a group's defaultPart overrides meta.defaultPart for its slots; a part with no run output makes its slots stand-ins; a file whose default part doesn't resolve places stand-in rectangles and reports unresolvable-reference; deleting key is rejected with its model kind naming key; the design bundle saves and reopens byte-identical."
covers = ["R1"]
after = [21, "23.5"]
hitl = false
risk = "high"

[[entry]]
id = 2
type = "story"
title = "One Corney column resolves from a chain"
description = "Fills the layout schema section (groups, slots, chain on axis x or y with offset, mm units) and adds the gap (meta.gap, x and y, edge to edge between keycaps) to meta, schema gaining Expression, Quantity and quantity(unit), Delta, Length, Angle, Vec2, Offset and Gap (spine Data Schema; their first reader, 2026-11-03), with the AddGroup, AddSlot, DuplicateNode and DeleteNode command classes (ids layout.addGroup and so on), the first registered commands, which 23.3's generic checks then cover, the free arrangement (default anchor = the parent origin), and model/worker's per-side placement computeds, reading through per-section selector computeds, with plain functions such as placeSlot that turn a group of chained slots into world frames, emitted as LayoutOutput rows (Data Schema): kind, frame, anchorAt (the anchor frame's origin before the offset), part (the slot's PartsOutput row; -1 on groups), fit, placed (false in or below a cycle, with NaN frame and anchorAt). Owns AD-24's who-points-at walk (deleteNode cascades over it; story 3's anchor graph uses it). Carries the must-not-recompute check (moved from 23.5): placement does not recompute when an unrelated section changes. Starts Corney's layout-command script in fixtures/ with one column."
verify = "A design built by Corney's script with one column as a chain places each key per the AD-4 step rule; deleting a group removes everything referencing it; the reference walk finds every reference in a design built from every section; saving and reopening it places the same; placement does not recompute when an unrelated section changes; a gap that isn't an expression is refused as design-invalid naming meta.gap.x."
unknown = "The spine's Open Question 'Units on quantities' (InferOutput drops the phantom unit; Length and Delta share one schema, so negative-length can't find Length fields; how the walk recognises an Expression; a unitless quantity) is settled before this story is planned."
covers = ["R1", "R2"]
after = [18]
hitl = false
risk = "medium"

[[entry]]
id = 22
type = "story"
title = "The Layout set reaches main"
description = "protocol's struct-of-arrays codecs for schema's LayoutOutput and PartsOutput (Data Schema), packing into fresh transferred buffers per post, each output's ids as one plain string[] sorted by schema's compareId (UTF-16 code-unit order). pipeline posts the Layout set, parts and layout, as one message at one seq, hidden phase included (an output holding row numbers into another travels with it); a focus arriving during the hidden phase lets the current stage finish, then the focused set is computed and posted before the remaining hidden stages; a design that produces no outputs (unsupported-form) gets zero-row outputs at each seq. workers stores and swaps the pair together in its stage snapshots' shallowRefs, reads typed views straight from the buffers and finds ids by binary search; a set has arrived when every output in it is at main's latest seq (AD-11). Story 7 draws it."
verify = "Tests: each codec round-trips; posting the same output twice leaves the worker's values intact (fresh buffers); main's binary search finds every id the worker sorted; a focus during the hidden phase gets its set next; a unibody design's Layout set arrives empty; a layout row never points at a PartsOutput from another seq."
covers = ["R6"]
after = [2]
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Explicit anchors move dependants, cycles rejected"
description = "setAnchor anchors any node to any slot attach point or group origin by id (vertex and construction-point anchors arrive with later slices), replacing the default anchor; placement moves dependants transitively. Anchors are a declared reference kind (AD-24), walked by story 2's walk. A command that would close a cycle is rejected through the design store's structural check with a Rejection of the first model kind, built with model/main's reject(kind, ids, message), naming the cycle's ids; a loaded cycle reports anchor-cycle in the worker's posted issues as a Violation (this story codes Violation, ViolationKind and Fix's v.variant schema, no variants until a fix names a command, (spine 2026-11-03)) and its members are not placed; an unknown anchor id reports unresolvable-reference."
verify = "Moving an anchored-to node moves its whole dependency chain; a cycle-closing setAnchor is rejected through the design store's structural check and the design is unchanged; a file with a cycle and one with an unknown id each report their violation with ids."
covers = ["R1", "R4"]
after = [2, "23.5"]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Corney wired's left half from commands"
description = "Rotation about the pivot carries along a chain, and an explicit anchor stops the carry and keeps the index. The key blueprint gains its per-slot `size` input (spine decision 57), so Corney's far thumb key is 1.5u. Corney's layout-command script authors Corney Island wired's left half (columns, stagger, 3-key thumb fan) through commands without absolute coordinates. A spike check compares its key centres with Ergogen using the existing fixtures/ key-centres harness (initiative Decision 2026-10-30)."
verify = "Invariant tests for rotation carry and the anchor stop pass; the spike check matches every left-half key centre of Corney wired within ±0.05 mm of Ergogen; the script holds no absolute coordinates; a key with a non-zero pivot round-trips through the layout codec with its world frame unchanged."
covers = ["R1", "R2"]
after = [3]
hitl = false
risk = "high"

[[entry]]
id = 6
type = "story"
title = "Right side derived, per-side overrides"
description = "model derives the right side of a split design with a reversible board by reflection across the centre frame's y-axis, with side-qualified ids, attach points swapped, and right-side frames carrying mirrored = true (Data Schema LayoutOutput); adds the overrides section (a list, AD-23) in its AD-8 position; a per-side override set by command (targeting left/<id> or right/<id>, part 'empty') removes the slot's part on that side, and the removed slot keeps its space (fit = empty, which wins over a stand-in); geometric right-side overrides are rejected; split files with a mirrored board and unibody files load and report unsupported-form in the posted issues. Corney's script gains the right side's overrides, and the headless slice scenario runs it."
