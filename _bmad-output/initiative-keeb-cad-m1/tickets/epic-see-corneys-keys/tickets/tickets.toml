[[entry]]
id = 2
type = "story"
title = "One Corney column resolves from a chain"
description = "Fills the layout and meta schema sections (groups, slots, chain +x/+y with gap and offset, pitch-x/pitch-y, u and mm units) with addGroup, addSlot, duplicateNode and deleteNode commands, the free arrangement (default anchor = the parent origin), and model's per-side placement computeds with plain functions such as placeSlot that turn a group of chained slots into world frames. Owns AD-24's who-points-at walk (deleteNode cascades over it; story 3's anchor graph uses it) and the test rejecting pass-through schema kinds. Starts Corney's layout-command script in fixtures/ with one column."
verify = "A design built by Corney's script with one column as a chain places each key per the AD-4 step rule; deleting a group removes everything referencing it; the reference walk finds every reference in a design built from every section; saving and reopening it places the same."
covers = ["R1", "R2"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Explicit anchors move dependants, cycles rejected"
description = "setAnchor anchors any node to any slot attach point or group origin by id (part, vertex and construction-point anchors arrive with later slices), replacing the default anchor; placement moves dependants transitively. Anchors are a declared reference kind (AD-24), walked by story 2's walk. A command that would close a cycle is rejected through the register's structural check with a typed rejection naming the cycle's ids; a loaded cycle reports anchor-cycle in story 14's violations list as a { kind, severity, ids, message, fixes } violation and its members are not placed; an unknown anchor id reports unresolvable-reference."
verify = "Moving an anchored-to node moves its whole dependency chain; a cycle-closing setAnchor is rejected and the design is unchanged; a file with a cycle and one with an unknown id each report their violation with ids."
covers = ["R1", "R4"]
after = [2, 14]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Corney wired's left half from commands"
description = "Rotation about the pivot carries along a chain, an explicit anchor stops the carry and keeps the index, empty slots advance the chain. Corney's layout-command script authors Corney Island wired's left half (columns, stagger, 3-key thumb fan) through commands without absolute coordinates. A spike check compares its key centres with Ergogen using the existing fixtures/ key-centres harness (initiative Decision 2026-10-30)."
verify = "Invariant tests for rotation carry, the anchor stop and empty slots pass; the spike check matches every left-half key centre of Corney wired within ±0.05 mm of Ergogen; the script holds no absolute coordinates."
covers = ["R1", "R2"]
after = [3]
hitl = false
risk = "high"

[[entry]]
id = 6
type = "story"
title = "Right side derived, population per side"
description = "model derives the right side of a split-reversible design by reflection across the centre frame's y-axis, with side-qualified ids and attach points swapped; setFitted sets population per side per slot, an unfitted slot keeps its place and index; geometric right-side overrides are rejected; split-mirrored and unibody files load and report unsupported-form. Corney's script gains the right side's population, and the headless slice scenario runs it."
