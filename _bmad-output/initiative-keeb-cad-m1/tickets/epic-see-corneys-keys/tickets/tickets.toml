[[entry]]
id = 9
type = "story"
title = "The workspace matches the 2026-10-30 spine"
description = "Scaffolds @keeb-cad/reactive, @keeb-cad/geometry and @keeb-cad/ui as stub packages with package exports (story 11 fills ui), adds @snap/ts-inject, immer and valibot (both pinned exactly), and pins @vue/reactivity exactly through one pnpm catalog entry with a test that one copy is installed. Rewrites the existing dependency-cruiser rules that contradict AD-10 (model may import reactive and geometry; plates, pcb and case may import geometry; plates, pcb, firmware, drc and storage may import reactive; ui may import vue and @vueuse/core; the vue rule must not catch reactive's @vue/reactivity import) and adds the new fences (only reactive imports @vue/reactivity, only geometry imports makerjs, only model's register concept imports immer, only ui imports reka-ui and @zag-js/hotkeys, worker code never imports reactive, reactive, geometry and ui import no workspace package), each with a violation fixture. Pinia, jsdom and @vue/test-utils were already removed on 2026-10-30."
verify = "pnpm check passes, and each new or rewritten fence rejects its violation fixture."
covers = []
after = ["1.3"]
hitl = false
risk = "low"

[[entry]]
id = 10
type = "story"
title = "Commands run through the register"
description = "model's register concept: the design service holding the authored sections in a shallowRef; defineCommand and defineAction (name, input schema, availability check over the read-only design, apply step); the command register service built from the root container's appended commands array, refusing duplicates; run parses every input with its Valibot schema to a fresh copy, applies it through one new Immer({ autoFreeze: true }) instance, keeps a returned Rejection outside the recipe, runs the structural-check hook, and returns { ok: true } or a Rejection; replaceDesign takes unknown, migrates (none yet), parses and deep-freezes. Frozen<T> and Writable<T>; Id, Length, Expression and ref(kind) Valibot helpers with one toJsonSchema overrideAction. The root container in main.ts with each package's <package>Services partial and the disjoint-getTokens test; story 12 provides it to components. Proven with a test-only command; design sections come in story 1."
verify = "Unit tests: a test command changes the design and the result is deeply frozen with no proxy; its caller's input stays unfrozen; a Vue reactive input is stored as plain data; a returned Rejection leaves the design untouched; an invalid input is refused with its path; an unavailable command is refused; a duplicate command name fails at startup; every exported command is registered; every command's input schema converts to JSON Schema; a nested write outside apply fails to compile (type test); the partials' tokens are disjoint."
covers = ["R4"]
after = [9]
hitl = false
risk = "high"

[[entry]]
id = 1
type = "story"
title = "A new design writes and reads back byte-identical"
description = "model gets the KDL v2 schema skeleton for all 14 AD-8 sections in order (the layout a tree, every other section a list, AD-23), declared in Valibot, with the canonical writer, id minting and the newDesign command (design id, name, form split-reversible) registered through story 10's register; reading a file goes through replaceDesign. Layer-3 generic checks over every registered command, so later stories' commands are covered automatically: after run the design is deeply frozen with no proxy and the caller's input unfrozen, and file write -> read round-trips. Story 2 fills the layout and meta sections; story 14 stores the file."
verify = "A test creates a design by command, writes it, reads it back through replaceDesign and writes again; the two files are byte-identical and the read design is deeply frozen; a file with sections out of order is rewritten in AD-8 order; the generic checks run over every registered command."
covers = ["R5"]
after = ["1.1", 10]
hitl = false
risk = "medium"

[[entry]]
id = 14
type = "story"
title = "A new design autosaves and reopens from the browser"
description = "storage gets its interface (save, load, listVersions, listDesigns) and the browser autosave backend: autosave after every applied command, 20 rolling versions, through the crossing in reactive with plain values only; failure is reported only when no rolling version is left to prune. pipeline wraps one live stage as a computed through reactive, with a must-not-recompute check. model's violations list computed starts here, empty until story 3 adds anchor-cycle and unresolvable-reference; story 15's status strip reads it. Story 12 reopens the last design through listDesigns."
verify = "A test runs a command, finds the design autosaved in browser storage, reopens it through load and replaceDesign byte-identical; the 21st autosave prunes the oldest; only plain data passes the crossing; the live stage does not recompute when an unrelated section changes."
covers = ["R5"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 11
type = "story"
title = "The ui foundation renders in the workbench"
description = "packages/ui per AD-26: Tailwind 4 @theme tokens from DESIGN.md (Frappé and Latte, the 4px grid aliases, radii 2/4/8), lint against arbitrary values, the OS-default theme with the localStorage override and the inline index.html script, self-hosted JetBrains Mono, the Icon component on @lucide/vue, Button, Kbd and a Tabs wrapper over Reka's tabs, the number formatter, and the hotkey layer on @zag-js/hotkeys taking plain { id, hotkey } data (story 12 feeds it from the register) with the register test rules (no unmodified or Shift-only symbol keys except a character-matched alias, no Alt+letter, no swap-pair letters). The workbench Vite entry renders every component in every state in both themes; browser-mode component tests mount the same state files."
verify = "Browser-mode tests in Chromium and Firefox pass for Button, Kbd, Icon, Tabs, the formatter and the hotkey layer (R fires on a Ukrainian layout via KeyboardEvent.code); the workbench builds and nothing in the app imports it; lint rejects an arbitrary-value class."
covers = ["R6"]
after = [9]
hitl = false
risk = "medium"

