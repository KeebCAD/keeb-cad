[[entry]]
id = 17
type = "story"
title = "The sandbox runs a blueprint lane"
description = "Adds @keeb-cad/blueprint (AD-10) per the blueprints spine. The host on quickjs-wasi 3.6.3, pinned exactly (BP-2), with the pending-job contract test. Determinism (BP-3): one factory per pinned version, a fresh instance per run; the allow-listed global scope (ECMAScript built-ins minus Date, Math.random, WeakRef, FinalizationRegistry, plus the frozen blueprint API), frozen, strict mode; maxStackSize 256 KiB; a fixed WASI clock and random source; the try/catch boundary returning { failed } cut at 500 characters; strict JSON result decode. Budgets (BP-4): 100 interrupt-handler steps and a 64 MiB memoryLimit, each pinned by a test; a VM whose memory has grown past 48 MiB is replaced in the next pause. The lane contract (BP-8): args { inputs, pulls, queries }, op holding only that stage's operations, results { outputs, problems } checked against each output's name and count; every host call through one host-call wrapper returning one JSON string (BP-1). The VM lifecycle (BP-9): one VM per pinned version with its uses' factories, a pool per worker, one handle table per run freed at its end. Nesting (BP-6): use() in the caller's VM, lane and handle table. The app's blueprint API version is 1, and blueprint-api-too-new; lane-failed with its causes, unavailable uncached (BP-5); the data-blueprint interpreter imports expr's evaluator (AD-17); expr is stubbed here (spine 2026-11-05): only -?digits(.digits)? immediately followed by lowercase mm or deg (no space, no +, no exponent, no leading '.', no unitless number), returning Result<{ value, unit }, ParseError>, which schema's Expression calls from 13.2, and 14.2 widens additively. Records the spine's two Deferred items without code: out-of-memory results that depend on garbage from earlier runs, and tagging handles as 2D or 3D; re-runs the spikes' timings and memory probes in a browser worker on AC before any number becomes a budget. Fences: blueprint imports only geometry, expr, schema and hashing, only blueprint imports quickjs-wasi, blueprint/authoring imports nothing at run time; each with a violation fixture; run tooling/verify-checks.sh."
verify = "Tests in Chromium and Firefox, per BP's Verification row: a stateful test blueprint gives the same output for the same input; a runaway stops at the step budget; an allocation loop fails out of memory, typed; a VM grown past 48 MiB is replaced in the next pause and one below it is kept; unbounded recursion fails typed; the global allow-list walk matches; a throwing getter never runs on the host; a nested blueprint can't see its caller; an output breaking its declared count fails the lane; a blueprint written for API version 2 is not run and reports blueprint-api-too-new, one written for 1 runs; the pending-job contract test; each new fence rejects its fixture; the timings re-run is recorded beside the spike verdict; the expr stub parses '19mm', '-15deg' and '0.5mm', and refuses '19 mm', '+19mm', '1e2mm', '.5mm', '19' and '19MM' with a ParseError."
covers = []
after = [16]
hitl = false
risk = "high"

[[entry]]
id = 21
type = "story"
title = "Library blueprints build and run in the model worker"
description = "Library blueprints are TS sources in library/blueprints-src, each one export default defineBlueprint({ id, version, inputs, uses, lanes }) whose declaration types args and op (BP-7). The library build type-checks each, validates its declaration with schema's, and splits it into a self-contained script (bundled, no imports, evaluating to { lanes: { <stage>: run } }) and the declaration as JSON, with a round-trip test of lane names. Declarations ship from library's main subpath, scripts only from library/worker, which only the model and case worker entries import; main never carries blueprint code, even as text. The lane runner lives in blueprint/worker: the model worker's entry hands the compiled scripts to story 17's VM pool, which it fills in the pause between applying patches and running stages; each stage passes its operation table and handle converter as arguments (runner.runLane(lane, { operations, convertHandle }, inputs)); the runner owns the per-run lane cache, LRU with 500 entries, memory-only, keyed per BP-5 (stage and version, blueprint version, the transitive closure of pinned uses, each argument's canonical hash). Fences: library/blueprints-src imports only blueprint/authoring; only the worker entries import library/worker; each with a violation fixture; run tooling/verify-checks.sh."
verify = "Tests: a test library blueprint builds into a script and declaration whose lane names match; a declaration that fails schema's validation fails the build; identical lane runs share one cache entry and a changed argument misses; with 500 entries cached, a new one evicts the least recently used and a just-used one stays; a deterministic failure is cached and an unavailable lane is not; the main bundle holds no blueprint script; each new fence rejects its fixture."
covers = []
after = [17]
hitl = false
risk = "high"

[[entry]]
id = 18
type = "story"
title = "A new design holds a default key part"
description = "schema gets the library-versions and parts sections in their AD-8 positions, meta.defaultPart (required) and DesignPart { type: 'blueprint' } with BlueprintInputs (spine Data Schema); library ships lib:blueprint/choc-key v1, a Choc v2 key at 1u whose one output is its rectangle (the keycap), plain { w, h } 18 x 18 mm centred on the slot's frame; no envelope (typed before 14.4) and no footprints yet; the NewDesign action's fresh design holds the design part key applying it, pinned in library-versions, with meta.defaultPart set (EXPERIENCE.md, decided 2026-11-01); the parts lane runs in the model worker (model/worker, the script from library/worker through blueprint/worker's lane runner (story 21); main reads declarations only) and resolves each slot's part to its rectangle through model's one slot -> part run computed (own part, else the nearest group's defaultPart, else meta.defaultPart, 'else' meaning unset; plus per-slot inputs), each run posted once with id '<part id>@<hash of its resolved inputs>' (Data Schema PartsOutput). A slot whose set reference doesn't resolve, or resolves with no run output (blueprint-api-too-new, a first run failing, unavailable), is a stand-in stepping by the next level's rectangle, else the app-defined 'stand-in' run, 18 x 18 mm (the 1u key, so a broken file keeps its 19 mm steps), drawn as a placeholder (AD-5). A reference that can't be found (a missing design part, an unpinned blueprint, an unknown library part) reports unresolvable-reference naming the slot: a warning for a design-local part, an error for a library or blueprint reference; a part that is found but has no run output reports only its blueprint violation. This story adds parts.deletePart (and library.unpin if the plan tests the pin case) carrying the check that refuses deleting the design part or library-versions entry that meta.defaultPart names, with the model rejection default-part-required (ModelRejectionKind gains it; AD-2's refusal, no replacement asked); this story also codes ref(kind), adds LibraryId to ItemId and tags a quantity input value { type: 'quantity'; value } (spine 2026-11-03). Fingerprints arrive with 7.2; until then the bundle's fingerprints file is empty (epic Decision 2026-11-02)."
verify = "A new design has key as its default part, pinned at version 1; a slot resolves its 18 x 18 mm rectangle from it; a group's defaultPart overrides meta.defaultPart for its slots; a part whose first run fails makes its slots stand-ins and reports only its blueprint violation; a slot naming a missing design part reports unresolvable-reference as a warning and one naming an unknown library part as an error, each naming the slot; a file whose default part doesn't resolve places 18 x 18 mm stand-in rectangles; parts.deletePart of key is refused with default-part-required naming key and the design unchanged; the design bundle saves and reopens byte-identical."
covers = ["R1"]
after = [21, "23.5"]
hitl = false
risk = "high"

[[entry]]
id = 2
type = "story"
title = "One Corney column resolves from a chain"
description = "Fills the layout schema section (groups, slots, chain on axis x or y with offset, mm units) and adds the gap (meta.gap, x and y, edge to edge between keycaps) to meta, schema gaining Expression, Quantity and quantity(unit), Delta, Length, Angle, Vec2, Offset and Gap (spine Data Schema; their first reader, 2026-11-03); a quantity field's schema refuses a literal of the wrong unit through a check from its quantity(unit) metadata (input-invalid or design-invalid at its path), and negative-length waits for 14.2's evaluator. The NewDesign action's meta.gap is 1 mm on x and y. The AddGroup, AddSlot, DuplicateNode and DeleteNode command classes (ids layout.addGroup and so on), the first registered commands, checked by 23.16's input copy and design parse: AddGroup and AddSlot take { parent?, index?, id?, ...fields } (an omitted parent is the root, an omitted index appends, an omitted id is minted with mintId(), a given one is checked with idSchema and refused when the design already has it); DuplicateNode inserts the copy after the original, mints new ids for the copied subtree (a chosen id gets a numeric suffix, thumb-home-2) and remaps references inside the copy; DeleteNode takes a list of ids and refuses the root. The free arrangement (default anchor = the parent origin), and model/worker's per-side placement computeds, reading through per-section selector computeds, with plain functions such as placeSlot that turn a group of chained slots into world frames; a group in a chain steps like a slot, by the bounding extent along the axis of its placed slots' rectangles (recursively through nested groups) in the group's own frame. model composes frames with 2D affine matrices through one compose function in geometry; rows are emitted as LayoutOutput (Data Schema): kind, frame ({ x, y, rot, mirrored }, rot read from the matrix and normalised to (-180, 180]), anchorAt (the anchor frame's origin before the offset), part (the slot's run id, which 22's codec writes as its PartsOutput row; -1 on groups), fit, placed (false in or below a cycle, with NaN frame and anchorAt). Owns AD-24's who-points-at walk; DeleteNode's cascade deletes only list items keyed to the deleted ids (none until 13.6's overrides), and a node anchored into the deleted subtree falls back to its default anchor (13.3). Carries the must-not-recompute check (moved from 23.5): placement does not recompute when an unrelated section changes. Starts Corney's layout-command script in reference-designs/ with one column, naming its nodes through the add commands' id input."
verify = "A design built by Corney's script with one column as a chain places each key per the AD-4 step rule, 19 mm apart with 1u keys and the new design's 1 mm gap; a chain holding a group steps it by its slots' bounding extent; an AddSlot with an omitted id gets a minted one, a given id is kept and one already in the design is refused, the design unchanged; DuplicateNode puts the copy after the original with new ids (thumb-home becomes thumb-home-2) and references inside the copy remapped; DeleteNode removes every listed node's subtree and refuses the root; the reference walk finds every reference in a design built from every section; saving and reopening it places the same; placement does not recompute when an unrelated section changes; a gap that isn't an expression, and one of '1deg', is refused as design-invalid naming meta.gap.x; a slot rotated 190 deg posts rot -170; angle comparisons in tests are mod 360."
unknown = "The spine's Open Question 'Units on quantities' (InferOutput drops the phantom unit; Length and Delta share one schema, so negative-length can't find Length fields; how the walk recognises an Expression; a unitless quantity) is settled before this story is planned; the sweep (2026-11-05, G5, G6) settled the stub's literal grammar, the wrong-unit literal check from quantity(unit)'s metadata and negative-length waiting for 14.2, while the spine still lists the question open. Open question: which Rejection kind refuses an add command's taken id and DeleteNode's root (ModelRejectionKind names no member for them)."
covers = ["R1", "R2"]
after = [18, "23.16"]
hitl = false
risk = "medium"

[[entry]]
id = 22
type = "story"
title = "The Layout set reaches main"
description = "protocol's struct-of-arrays codecs for schema's LayoutOutput and PartsOutput (Data Schema), packing into fresh transferred buffers per post, each output's ids as one plain string[] sorted by schema's compareId (UTF-16 code-unit order). pipeline posts the Layout set, parts and layout, as one message at one seq, hidden phase included (an output holding row numbers into another travels with it); LayoutOutput's codec turns each slot's run id from model into its row in the PartsOutput packed in the same post; a focus arriving during the hidden phase lets the current stage finish, then the focused set is computed and posted before the remaining hidden stages; a design that produces no outputs (unsupported-form) gets zero-row outputs at each seq. workers stores and swaps the pair together in its stage snapshots' shallowRefs, reads typed views straight from the buffers and finds ids by binary search; a set has arrived when every output in it is at main's latest seq (AD-11). Story 7 draws it."
verify = "Tests: each codec round-trips; posting the same output twice leaves the worker's values intact (fresh buffers); main's binary search finds every id the worker sorted; a focus during the hidden phase gets its set next; a unibody design's Layout set arrives empty; a slot row's part is the row of its run id in the PartsOutput of the same post; a layout row never points at a PartsOutput from another seq."
covers = ["R6"]
after = [2]
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Explicit anchors move dependants, cycles rejected"
description = "setAnchor anchors any node to any slot attach point or group origin by id (vertex and construction-point anchors arrive with later slices), replacing the default anchor and keeping the offset as written, so the node moves; setAnchor with no target clears the anchor to the default (keeping the world position is 15.3's re-anchor in place). An omitted attach is center; attach points lie on the slot's rectangle in its own frame, y up: edges at +-w/2 and +-h/2, corners at their combinations (edge-top at +h/2), and the attach frame takes the slot's rotation. Placement moves dependants transitively. Anchors are a declared reference kind (AD-24), walked by story 2's walk. The dependency graph holds default-anchor edges (previous chain sibling, parent's origin) and explicit anchors (parameter references join in 14.2); one model/main query wouldCycle(design, node, target) answers whether an anchor would close a cycle (15.6's picker reads it), and a command that would close one is rejected through the design store's structural check with a Rejection of the first model kind, built with model/main's reject(kind, ids, message), naming the cycle in order from the changed node; a loaded cycle reports dependency-cycle (error) in the worker's posted issues as a Violation listing its members only (this story codes Violation, ViolationKind and Fix's v.variant schema, no variants until a fix names a command, (spine 2026-11-03)), and its members and their dependants are not placed. A node anchored to an unknown id is not placed (placed: false) with its dependants, not drawn, and reports unresolvable-reference (error) naming the node. Each kind's message is built by one model function from its kind and ids, with its own unit tests, which other tests call to assert whole violations. DeleteNode of an anchored-to node, or of a node in its subtree, leaves each node anchored to it on its default anchor with its offset unchanged."
verify = "Moving an anchored-to node moves its whole dependency chain; setAnchor keeps the offset as written and the node moves by the anchor's difference; setAnchor with no target puts the node back on its default anchor; an omitted attach anchors to center; edge-top sits at +h/2 in the slot's frame and turns with the slot's rotation; wouldCycle is true for anchoring a chain's first child to its second (a default-anchor edge) and false for an unrelated target; a cycle-closing setAnchor is rejected through the design store's structural check, naming the cycle in order from the changed node, and the design is unchanged; a file with a cycle reports dependency-cycle listing its members, and they and their dependants post placed false; a file with an unknown anchor id reports unresolvable-reference as an error naming the node, which posts placed false with its dependants; deleting an anchored-to node leaves its dependant on its default anchor with the same offset; each violation is asserted whole through its kind's message function."
covers = ["R1", "R4"]
after = [2, "23.5"]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Corney wired's left half from commands"
description = "Rotation about the pivot carries along a chain, and an explicit anchor stops the carry and keeps the index. The key blueprint gains its per-slot `size` input (spine decision 57) in choc-key v1 in place (library versions are mutable before the first public preview), so Corney's far thumb key is 1.5u, 27 x 18 mm. A command that sets a blueprint input its pinned declaration doesn't allow (an unknown input, a value outside the declaration) is refused on main with the model rejection blueprint-input-invalid (ModelRejectionKind gains it); a loaded file with one reports the violation blueprint-input-invalid and the slot is a stand-in. Corney's layout-command script in reference-designs/ authors Corney Island wired's left half (columns, stagger, 3-key thumb fan) through commands, naming its nodes through the add commands' id input, without absolute coordinates: an absolute position is an offset position on a node anchored only to the root, and the script has exactly one, the left half's group offset from the centre; every other position comes from chains, anchors and relative offsets. A spike check compares its key centres with Ergogen using the existing reference-designs/ key-centres harness (initiative Decision 2026-10-30), translating by that one offset, within +-0.05 mm, angles compared mod 360."
verify = "Invariant tests for rotation carry and the anchor stop pass; the spike check matches every left-half key centre of Corney wired within +-0.05 mm of Ergogen after translating by the left half's group offset, angles mod 360; the script's only absolute position is the left half's group offset; a slot with size '1.5u' has a 27 x 18 mm rectangle; a slot input the declaration doesn't name, and a size it doesn't list, are each refused with blueprint-input-invalid and the design unchanged; a loaded file with one reports blueprint-input-invalid and places the slot as a stand-in; a key with a non-zero pivot round-trips through the layout codec with its world frame unchanged."
covers = ["R1", "R2"]
after = [3]
hitl = false
risk = "high"

[[entry]]
id = 6
type = "story"
title = "Right side derived, per-side overrides"
description = "model derives the right side of a split design with a reversible board by reflection across the centre frame's y-axis, with side-qualified ids, attach points swapped, and right-side frames carrying mirrored = true, rot normalised to (-180, 180] (Data Schema LayoutOutput); adds the overrides section (a list, AD-23) in its AD-8 position, its schema holding every variant of the Data Schema's overrides, side-component included, though only 'empty' gets a command and tests here (a side-component command waits for the first part with components, epic-parts-and-pcb); an override is keyed by (type, target), plus component for side-component, at most one per key, and setting it again replaces it. A per-side override set by command (targeting left/<id> or right/<id>, part 'empty') removes the slot's part on that side, and the removed slot keeps its space (fit = empty, which wins over a stand-in); on a reversible board the set-override command refuses a swap with the model rejection override-not-allowed (ModelRejectionKind gains it), and no command takes a right-side position; a loaded swap reports the violation override-not-allowed (error, ids: the target) and is ignored when placing; an override whose target is missing reports unresolvable-reference; DeleteNode of a slot deletes its overrides in the same command. Split files with a mirrored board and unibody files load and report unsupported-form (error, ids: the design id) in the posted issues; each kind's message comes from 13.3's per-kind message function. Corney's script sets no overrides (the real board has none); a documented test-only step file, never part of the reference script, removes the far thumb key on the right. The epic's headless scenario: run Corney's script, post the Layout set, the right half is the left's reflection across the centre, each override of the test-only step file applies, and no violation appears beyond the expected."
