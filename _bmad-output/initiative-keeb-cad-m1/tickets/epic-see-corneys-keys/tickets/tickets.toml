[[entry]]
id = 20
type = "story"
title = "The model worker mirrors the design"
description = "reactive's generic protocol machine (epoch and seq, one dispatcher per side, transfer lists) and protocol's first messages: the whole design, patches with (epoch, seq), focus, issues and stage-started (AD-11). Main spawns the model worker from main's partials; the worker entry builds its own container from modelWorkerServices. Main sends the whole design (with the derived files it holds, none yet) at worker start and on replaceDesign, then each applied command's patches; the worker applies them in order through 10's applyDesignPatches, so its mirror is deep-frozen. The worker posts issues (empty until 13.3) and stage-started, each echoing its seq; main drops a post from an older seq or another epoch. On a crash (the worker's error event or a message that fails to deserialize) main restarts the worker with a new epoch and the whole design. The mirror's hash check waits for its spike (spine Open Questions)."
verify = "Tests in Chromium and Firefox: after a command the worker's mirror equals main's design and is deeply frozen; a post from an older seq and one from another epoch are dropped; a crashed worker restarts with a new epoch and the whole design; the main entry's graph never reaches pipeline (fence)."
covers = []
after = [1]
hitl = false
risk = "high"

