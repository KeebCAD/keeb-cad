title = "The Layout set reaches main"
description = "protocol's struct-of-arrays codecs for schema's LayoutOutput and PartsOutput (Data Schema), packing into fresh transferred buffers per post, each output's ids as one plain string[] sorted by schema's compareId (UTF-16 code-unit order). pipeline posts the Layout set, parts and layout, as one message at one seq, hidden phase included (an output holding row numbers into another travels with it); model already writes each slot row's part as its run's row in the PartsOutput posted beside it (13.2, Sergii 2026-11-10), so LayoutOutput's codec packs part as given; focus reordering waits for the first story that fills a second workspace set (Sergii 2026-11-10, 13.22's plan; deferred-work.md); a design that produces no outputs (unsupported-form) gets zero-row outputs at each seq. workers stores and swaps the pair together in its stage snapshots' shallowRefs, reads typed views straight from the buffers and finds ids by binary search; a set has arrived when every output in it is at main's latest seq (AD-11). Story 7 draws it."
