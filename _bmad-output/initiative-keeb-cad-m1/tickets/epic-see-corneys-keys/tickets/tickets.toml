description = "Rotation about the pivot carries along a chain, and the next sibling's own offset rotation cancels a turn that must not carry (a chain child has no explicit anchor; spine AD-4, Sergii 2026-11-13). The key blueprint gains its per-slot `size` input (spine decision 57) in choc-key v1 in place (library versions are mutable before the first public preview), so Corney's far thumb key is 1.5u, 27 x 18 mm. A command that sets a blueprint input its pinned declaration doesn't allow (an unknown input, a value outside the declaration) is refused on main with the model rejection blueprint-input-invalid (ModelRejectionKind gains it); a loaded file with one reports the violation blueprint-input-invalid and the slot is a stand-in. Corney's layout-command script in reference-designs/ authors Corney Island wired's left half (columns, stagger, 3-key thumb fan) through commands, naming its nodes through the add commands' id input, without absolute coordinates: an absolute position is an offset position on a node anchored only to the root, and the script has exactly one, the left half's group offset from the centre; every other position comes from chains, anchors and relative offsets. A spike check compares its key centres with Ergogen using the existing reference-designs/ key-centres harness (initiative Decision 2026-10-30), translating by that one offset, within +-0.05 mm, angles compared mod 360."
