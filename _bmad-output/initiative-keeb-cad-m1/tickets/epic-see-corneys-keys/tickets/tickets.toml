[[entry]]
id = 10
type = "story"
title = "Commands run through the register"
description = "model's register concept: the design service holding the authored sections in a shallowRef; defineCommand and defineAction (name, input schema, availability check over the read-only design, apply step); the command register service built from the root container's appended commands array, refusing duplicates; run parses every input with its Valibot schema to a fresh copy, applies it through one new Immer({ autoFreeze: true }) instance with enablePatches(), returning the command's patches, keeps a returned Rejection outside the Immer producer, runs the structural-check hook, and returns { ok: true } or a Rejection; replaceDesign takes unknown, migrates (none yet), parses and deep-freezes. Frozen<T> and Writable<T>; Id, Length, Expression and ref(kind) Valibot helpers. The register's file is the one place that sets up Immer and also exports applyDesignPatches (story 20's worker mirror uses it). The root container in main.ts merges main's partials (modelMainServices from model/main, AD-25), none of which holds commands, with the disjoint-getTokens test over every thread's partials; story 12 provides it to components. The design's meta section (design id, name, form; AD-8's first section) is the register's first real data: its Valibot schema in model, and the Design type, the design service and replaceDesign's parse are built on it, so story 1 extends them to the other sections instead of replacing a placeholder. Proven with a test-only command that renames the design; newDesign and id minting stay in story 1, the gap in story 2, provenance in 22.1."
verify = "Unit tests: a test command changes the design and the result is deeply frozen with no proxy; its caller's input stays unfrozen; a Vue reactive input is stored as plain data; a returned Rejection leaves the design untouched; an invalid input is refused with its path; an unavailable command is refused; a duplicate command name fails at startup; every exported command is registered; a nested write outside apply fails to compile (type test); a command's patches applied through applyDesignPatches to the previous design give the new one; every thread's partials' tokens are disjoint; replaceDesign accepts a valid meta-only design deeply frozen and refuses one with an unknown form, naming the path."
covers = ["R4"]
after = [19]
hitl = false
risk = "high"

