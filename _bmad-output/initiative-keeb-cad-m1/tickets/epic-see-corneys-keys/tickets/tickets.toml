[[entry]]
id = 21
type = "story"
title = "Library blueprints build and run in the model worker"
description = "Library blueprints are TS sources in library/blueprints-src, each one export default defineBlueprint({ id, version, inputs, uses, lanes }) whose declaration types args and op (BP-7). The library build type-checks each, validates its declaration with schema's (this story codes DeclaredInput as a v.variant on kind: quantity with a required unit and an optional range, option with its options, the other kinds with neither, the common fields shared; a builder per branch; spine Data Schema, 2026-11-07), and splits it into a self-contained script (bundled, no imports, evaluating to { lanes: { <stage>: run } }) and the declaration as JSON, with a round-trip test of lane names. Declarations ship from library's main subpath; library/worker exports LibraryData (schema's Data Schema type: declarations of every released version, eager; loadScript(id, version) returning AsyncResult<string, ScriptLoadFailed>, the compiled script as one lazy chunk per version through import.meta.glob over the build's compiled scripts with ?raw, wrapped with AsyncResult.fromPromise; this story adds ScriptLoadFailed { kind: 'script-load-failed', message } to schema), which only the model and case worker entries import; main never carries blueprint code, even as text. The lane runner lives in blueprint/worker: the model worker's entry hands LibraryData to the lane runner (runner.useLibrary), which loads the scripts of the pins pipeline hands it and awaits each loadScript in the pause (the model-worker entry passed () => [] until 13.18 derived the pins from library-versions; 13.21's plan) between applying patches and running stages; a loadScript Err is the runner's unavailable lane result (not cached), and while any lane is unavailable (except a version the declarations lack, which answers unavailable once and is not retried; 13.21's plan) pipeline re-enters the pause on a backoff (about 1 s doubling, capped at 30 s; the exact values are a plan decision, tested with fake timers; an edit retries at once; spine 2026-11-07). The per-version chunks need worker.format 'es', which 23.7 sets; each stage passes its operation table and handle converter as arguments (runner.runLane(lane, { operations, convertHandle }, inputs)); the runner owns the per-run lane cache, LRU with 500 entries, memory-only, keyed per BP-5 (stage and version, blueprint version, the transitive closure of pinned uses, each argument's canonical hash). Fences: library/blueprints-src imports only blueprint/authoring, and library's generated drawn-edge rule (GRAPH's library: schema) is scoped to its runtime files so it doesn't also catch blueprints-src; only the worker entries import library/worker is already fenced (23.1); each with a violation fixture; tooling/check-steps.spec.ts passes (it replaced verify-checks.sh in #11)."
