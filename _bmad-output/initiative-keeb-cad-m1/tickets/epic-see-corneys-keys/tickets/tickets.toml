[[entry]]
id = 17
type = "story"
title = "The sandbox runs a blueprint lane"
description = "Fills @keeb-cad/blueprint (scaffolded by 23.1 with its root, worker and authoring entries; AD-10) per the blueprints spine. The host on quickjs-wasi 3.6.3, pinned exactly (BP-2), with the pending-job contract test. Determinism (BP-3): one factory per pinned version, a fresh instance per run; the allow-listed global scope (ECMAScript built-ins minus Date, Math.random, WeakRef, FinalizationRegistry, plus the frozen blueprint API), frozen, strict mode; maxStackSize 256 KiB; a fixed WASI clock and random source; the try/catch boundary returning { failed } cut at 500 characters; strict JSON result decode. Budgets (BP-4): 100 interrupt-handler steps and a 64 MiB memoryLimit, each pinned by a test; a VM whose memory has grown past 48 MiB is replaced in the next pause. The lane contract (BP-8): args { inputs, pulls, queries }, op holding only that stage's operations, results { outputs, problems } checked against each output's name and count; every host call through one host-call wrapper returning one JSON string (BP-1). The VM lifecycle (BP-9): one VM per pinned version with its uses' factories, a pool per worker, one handle table per run freed at its end. Nesting (BP-6): use() in the caller's VM, lane and handle table. The app's blueprint API version is 1, and blueprint-api-too-new; lane-failed with its causes, unavailable uncached (BP-5); this story adds blueprint-api-too-new and lane-failed to schema's ViolationKind, which 23.4 codes empty (spine 2026-11-07); the data-blueprint interpreter imports expr's evaluator (AD-17); expr is stubbed here (spine 2026-11-05): only -?digits(.digits)? immediately followed by lowercase mm or deg (no space, no +, no exponent, no leading '.', no unitless number), returning Result<{ value, unit }, ParseError>, which schema's Expression calls from 13.2, and 14.2 widens additively. Records the spine's two Deferred items without code: out-of-memory results that depend on garbage from earlier runs, and tagging handles as 2D or 3D; re-runs the spikes' timings and memory probes in a browser worker on battery in power-saver (not on AC; Sergii 2026-11-08) before any number becomes a budget. expr imports result under AD-10's amended kernel line (2026-11-07): this story changes .dependency-cruiser.mts so every kernel but result may import result (KERNELS' comment, allowedTargets' kernel branch from [] to ['result'], result itself still []), updates tooling/ad10/rules.spec.ts's 'gives every non-kernel row di, reactive and result, and no kernel any' to the new rule (closing deferred-work's card that its name claims more than its expects), and adds a violation fixture for a kernel importing result (allowed), while tooling/ad10/violations' existing fixtures (geometry importing di and reactive, result importing di) stay rejected. Fences: blueprint imports only geometry, expr, schema and hashing, only blueprint imports quickjs-wasi, blueprint/authoring imports nothing at run time; each with a violation fixture; tooling/check-steps.spec.ts passes (it replaced verify-checks.sh in #11)."
