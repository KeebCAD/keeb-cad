[[entry]]
id = 17
type = "story"
title = "The sandbox runs a blueprint lane"
description = "Adds @keeb-cad/blueprint (AD-10 kernel) per the blueprints spine. The host on quickjs-wasi 3.6.3, pinned exactly (BP-2), with the pending-job contract test. Determinism (BP-3): one factory per pinned version, a fresh instance per run; the allow-listed global scope (ECMAScript built-ins minus Date, Math.random, WeakRef, FinalizationRegistry, plus the frozen blueprint API), frozen, strict mode; maxStackSize 256 KiB; a fixed WASI clock and random source; the try/catch boundary returning { failed } cut at 500 characters; strict JSON result decode. Budgets (BP-4): 100 interrupt-handler steps and a 64 MiB memoryLimit, each pinned by a test. The lane contract (BP-8): args { inputs, pulls, queries }, op holding only that stage's operations, results { outputs, problems } checked against each output's name and count; every host call through one host-call wrapper returning one JSON string (BP-1). The VM lifecycle (BP-9): one VM per pinned version with its uses' factories, a pool per worker, one handle table per run freed at its end. Nesting (BP-6): use() in the caller's VM, lane and handle table. The blueprint API version and blueprint-api-too-new; lane-failed with its causes, unavailable uncached (BP-5); model's expression evaluator passed in (AD-17). From the spine's Deferred: out-of-memory results that depend on garbage from earlier runs, tagging handles as 2D or 3D, and the spikes' timings and memory probes re-run in a browser worker on AC before any number becomes a budget. Fences: blueprint imports only geometry, only blueprint imports quickjs-wasi, blueprint/authoring imports nothing at run time; each with a violation fixture; run tooling/verify-checks.sh."
verify = "Tests in Chromium and Firefox, per BP's Verification row: a stateful test blueprint gives the same output for the same input; a runaway stops at the step budget; an allocation loop fails out of memory, typed; unbounded recursion fails typed; the global allow-list walk matches; a throwing getter never runs on the host; a nested blueprint can't see its caller; an output breaking its declared count fails the lane; a newer API is not run and reports blueprint-api-too-new; the pending-job contract test; each new fence rejects its fixture; the timings re-run is recorded beside the spike verdict."
covers = []
after = [16]
hitl = false
risk = "high"

