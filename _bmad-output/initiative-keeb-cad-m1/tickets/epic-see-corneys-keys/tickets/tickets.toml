[[entry]]
id = 3
type = "story"
title = "Explicit anchors move dependants, cycles rejected"
description = "setAnchor anchors any node except a chain child to any slot attach point or group origin by id (a chain child has no anchor: the schema gives a chain's children no anchor field, so a file holding one fails to load as design-invalid, and setAnchor on one is refused with chain-child-anchored; spine AD-3, Sergii 2026-11-13) (vertex and construction-point anchors arrive with later slices), replacing the default anchor and keeping the offset as written, so the node moves; setAnchor with no target clears the anchor to the default (keeping the world position is 15.3's re-anchor in place). An omitted attach is center; attach points lie on the slot's rectangle in its own frame, y up: edges at +-w/2 and +-h/2, corners at their combinations (edge-top at +h/2), and the attach frame takes the slot's rotation. Placement moves dependants transitively. A group's extent counts only the slots placed from inside it: a descendant anchored outside the group, and what depends on it, is left out (spine AD-4, 2026-11-13). Anchors are a declared reference kind (AD-24), walked by story 2's walk. The dependency graph holds default-anchor edges (previous chain sibling, parent's origin) and explicit anchors (parameter references join in 14.2); one model/main query wouldCycle(design, node, target) answers whether an anchor would close a cycle (15.6's picker reads it), and setAnchor's own check (checkSetAnchor, which availability and apply both call) refuses a node or target the design lacks or of the wrong kind with unknown-target and one that would close a cycle with a Rejection of the model kind dependency-cycle (ModelRejectionKind gains it and chain-child-anchored), built with model/main's reject(kind, ids, message) from 13.18, naming the cycle in order from the changed node, while the design store's structural check refuses a cycle any other command closes (a DeleteNode whose fallback closes one); a loaded cycle reports dependency-cycle (error) in the worker's posted issues as a Violation listing its members only (Violation and the empty fixSchema come from 23.4; this story adds dependency-cycle to ViolationKind; spine 2026-11-07), and its members and their dependants are not placed. A node anchored to an unknown id is not placed (placed: false) with its dependants, not drawn, and reports unresolvable-reference (error) naming the node (spine Violations row, 2026-11-07; only a file can hold one, since deleting the target clears the anchor and 13.2's structural check refuses any other edit that leaves one). Each kind's message is built by one model function from its kind and ids, with its own unit tests, which other tests call to assert whole violations. DeleteNode of an anchored-to node, or of a node in its subtree, leaves each node anchored to it on its default anchor with its offset unchanged. DuplicateNode remaps references inside the copy through story 2's walk: an anchor whose target was copied too names that target's copy, and an anchor to a node outside the copy keeps its target (spine AD-2, 2026-11-10; moved here from 13.2). The structural check refuses only a cycle the edit closes: a cycle already in a loaded file blocks no later edit (spine AD-2, checkStructure(previous, next))."
verify = "Moving an anchored-to node moves its whole dependency chain; setAnchor keeps the offset as written and the node moves by the anchor's difference; setAnchor with no target puts the node back on its default anchor; an omitted attach anchors to center; edge-top sits at +h/2 in the slot's frame and turns with the slot's rotation; wouldCycle is true for anchoring a chain group to its second child (a default-anchor edge) and false for an unrelated target; a cycle-closing setAnchor is rejected by setAnchor's check, and availability says the same, naming the cycle in order from the changed node, and the design is unchanged; setAnchor on a chain child is refused with chain-child-anchored; a file with an anchored chain child fails to load as design-invalid; a DeleteNode whose fallback closes a cycle is refused with dependency-cycle; a free group in a chain with one child anchored outside it steps by its other slots; a file with a cycle reports dependency-cycle listing its members, and they and their dependants post placed false; a file with an unknown anchor id reports unresolvable-reference as an error naming the node, which posts placed false with its dependants; deleting an anchored-to node leaves its dependant on its default anchor with the same offset; duplicating a group whose child anchors to a sibling gives the copy's child an anchor to the sibling's copy, and a child anchored outside the group keeps its target; an unrelated edit to a design loaded with a cycle commits; each violation is asserted whole through its kind's message function."
covers = ["R1", "R4"]
after = [2, "23.5"]
hitl = false
risk = "medium"
unknown = ""

