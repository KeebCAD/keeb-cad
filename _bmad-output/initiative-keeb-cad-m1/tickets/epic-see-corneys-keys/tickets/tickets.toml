[[entry]]
id = 2
type = "story"
title = "One Corney column resolves from a chain"
description = "Fills the layout schema section (groups, slots, chain on axis x or y with offset, mm units) and adds the gap (meta.gap, x and y, edge to edge between keycaps) to meta, schema gaining, on 13.21's expressionSchema, Quantity and quantity(unit) (declared as returning v.GenericSchema<string, Quantity<U>>, its one cast inside), lengthSchema, deltaSchema and angleSchema (each quantity(unit) plus v.metadata({ quantity: 'length' | 'delta' | 'angle' })) with their types Length, Delta and Angle, Vec2, Offset and Gap, with the test builders aLength, aDelta and anAngle; no unitless field (spine Data Schema; their first reader, 2026-11-03, 2026-11-07); a quantity field's schema refuses a literal of the wrong unit through a check from its quantity(unit) metadata (input-invalid or design-invalid at its path), and negative-length waits for 14.2's evaluator. The NewDesign action's meta.gap is 1 mm on x and y. The AddGroup, AddSlot, DuplicateNode and DeleteNode command classes (ids layout.addGroup and so on), the first registered commands, checked by 23.16's input copy and design parse: AddGroup and AddSlot take { parent?, index?, id?, ...fields } (an omitted parent is the root, an omitted index appends, an omitted id is minted with mintId(), a given one is checked with idSchema and refused with the model rejection id-taken naming that id; a parent that is missing or not a group is refused with unknown-target naming it); DuplicateNode inserts the copy after the original, gives every copied id the lowest free -N from 2 after stripping an -N ending (thumb-home-2); remapping references inside the copy moved to 13.3 (Sergii 2026-11-10, 13.2's plan); DeleteNode takes a list of ids and refuses the root with root-required naming it. This story adds id-taken, root-required, index-out-of-range (AddGroup or AddSlot given an index above the parent's child count, naming the parent) and unknown-target to ModelRejectionKind, built with 13.18's reject; DuplicateNode and DeleteNode refuse the root with root-required and any id the design lacks with unknown-target, naming every missing one and changing nothing (Sergii 2026-11-10); the design store's structural check raises unknown-target, through the reference walk as the cycle check does, for any declared reference an edit leaves pointing at an id the design lacks or at the wrong kind, so a dangling reference comes only from a file (spine Data Schema, 2026-11-07). The free arrangement (default anchor = the parent origin), and model/worker's per-side placement computeds, reading through per-section selector computeds, with plain functions such as placeSlot that turn a group of chained slots into world frames; a group in a chain steps like a slot, by the bounding extent along the axis of its placed slots' rectangles (recursively through nested groups) in the group's own frame. model composes frames with 2D affine matrices through one compose function in geometry; rows are emitted as LayoutOutput (Data Schema): kind, frame ({ x, y, rot, mirrored }, rot read from the matrix and normalised to (-180, 180]), anchorAt (the anchor frame's origin before the offset), part (the row of the slot's run in the parts output's ids; -1 on groups; Sergii 2026-11-10), fit, placed (false in or below a cycle, with NaN frame and anchorAt). Owns AD-24's who-points-at walk, which recognises an Expression by its expression metadata (inherited by every quantity schema) and yields parameter references (none until 14.2); DeleteNode's cascade deletes only list items keyed to the deleted ids (none until 13.6's overrides), and a node anchored into the deleted subtree falls back to its default anchor (13.3). Carries the must-not-recompute check (moved from 23.5): placement does not recompute when an unrelated section changes. Starts Corney's layout-command script in reference-designs/ with one column, naming its nodes through the add commands' id input."
