title = "A new design holds a default key part"
description = "schema gets the library-versions and parts sections in their AD-8 positions, meta.defaultPart (required) and DesignPart { type: 'blueprint' } with BlueprintInputs (spine Data Schema); library ships lib:blueprint/choc-key v1, a Choc v2 key at 1u whose one output is its rectangle (the keycap), plain { w, h } 18 x 18 mm centred on the slot's frame; no envelope (typed before 14.4) and no footprints yet; the NewDesign action's fresh design holds the design part key applying it, pinned in library-versions, with meta.defaultPart set (EXPERIENCE.md, decided 2026-11-01); the parts lane runs in the model worker: this story codes model/worker's createDerivations(design: ReadonlyRef<Frozen<Design>>, library: LibraryData, runner: LaneRunner), returning { parts, pins } (13.18's plan) and adds its call to app's model-worker start file with design/worker's mirror and library/worker's LibraryData, handing the derivations to pipeline, which posts stage-started { stage: 'parts' } (the script from library/worker through blueprint/worker's lane runner, story 21; main reads declarations only; spine 2026-11-07) and resolves each slot's part to its rectangle through model's one slot -> part run computed (own part, else the nearest group's defaultPart, else meta.defaultPart, 'else' meaning unset; plus per-slot inputs), each run kept once in the worker's run table with id '<part id>@<argumentHash of its inputs>' (13.22 posts it as PartsOutput { ids, rows }; 13.18's plan). A slot whose set reference doesn't resolve, or resolves with no run output (blueprint-api-too-new, a first run failing, unavailable), is a stand-in stepping by the next level's rectangle, else the app-defined 'stand-in' run, 18 x 18 mm (the 1u key, so a broken file keeps its 19 mm steps), drawn as a placeholder (AD-5). A reference that can't be found (a missing design part, an unpinned blueprint, an unknown library part) reports unresolvable-reference naming the slot (this story adds it to ViolationKind, the first model kind): a warning for a design-local part, an error for a library or blueprint reference; a part that is found but has no run output reports only its blueprint violation, and an unavailable run reports none (13.18's plan). This story adds parts.deletePart carrying the check that refuses deleting the design part meta.defaultPart names (M1 has no library.unpin: pins are added by the commands that use a library item and never removed by hand; spine AD-2, 2026-11-07), with the model rejection default-part-required (this story codes model/main's reject(kind, ids, message) and ModelRejectionKind's first member; AD-2's refusal, no replacement asked); this story also codes ref(kind), adds LibraryId to ItemId (the tagged quantity input value { type: 'quantity'; value } came with 13.21). Fingerprints arrive with 7.2; until then the bundle's fingerprints file is empty (epic Decision 2026-11-02). This story hands the pins it derives from library-versions to the pause, replacing the () => [] that 13.21 leaves at the model-worker start file's Pipeline.listen call. After running stages, it re-enters BlueprintPause's backoff when LaneRunner.hasUnavailable is true (a VM lost mid-stage), with fake-timer rows; 13.21 reads the flag only after its own pause."
