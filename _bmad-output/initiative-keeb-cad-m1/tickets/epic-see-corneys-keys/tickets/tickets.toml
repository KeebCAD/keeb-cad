description = "setAnchor anchors any node to any slot attach point or group origin by id (vertex and construction-point anchors arrive with later slices), replacing the default anchor; placement moves dependants transitively. Anchors are a declared reference kind (AD-24), walked by story 2's walk. A command that would close a cycle is rejected through the register's structural check with a typed rejection naming the cycle's ids; a loaded cycle reports anchor-cycle in story 14's violations list as a { kind, severity, ids, message, fixes } violation and its members are not placed; an unknown anchor id reports unresolvable-reference."
verify = "Moving an anchored-to node moves its whole dependency chain; a cycle-closing setAnchor is rejected and the design is unchanged; a file with a cycle and one with an unknown id each report their violation with ids."
