[[entry]]
id = 7
type = "story"
title = "Layout canvas shows resolved keys and adds groups and slots"
description = "The Layout workspace's 2D canvas, inline SVG drawn by Vue templates (AD-22), draws only the design and story 22's posted Layout set (parts and layout) at one seq, computing no geometry; focus names the Layout workspace. Each part rectangle is placed at its slot's frame with translate(x, y) rotate(rot) scale(mirrored ? -1 : 1, 1), in model mm inside the viewport's y-flipped group, strokes non-scaling (AD-22); handles sit only at posted frame and anchorAt points; rows posted unplaced are not drawn (the violation shows the cycle, 14.6). After a workspace switch the last snapshot draws as is and grays, with the status strip showing updating, if the set hasn't arrived within the switch grace (~200 ms). It draws placed keys as keycaps with group frames and anchor links in both themes; G adds a free group and S a slot through an add flow that shows an optional id field, pre-filled with a minted id and editable before commit (13.2's id input; ids never change afterwards); Ctrl+D duplicates the selection after the original and Delete deletes it (one DeleteNode with the selected ids), each through the design store; click selects, and 23.8's tree slide-out lists the nodes on a Tree wrapper over Reka's tree in ui and stays synced; wheel zoom toward the cursor, x1.1 per notch, between 10% and 2000%; middle or Space drag and trackpad pan; F fits the selection, else the whole board, with 24 px padding; the viewport is a service stored per design id in localStorage and shared across 2D workspaces, and it feeds the status strip's cursor coordinates (model mm through 23.6's formatter, 'x 12.34 y -5.67') and zoom as a whole percent, added to 23.8's strip; the tunable constants (zoom range and step, fit padding) sit in one place (EXPERIENCE.md 2026-11-05). Its canvas, selection and viewport are what every later 2D story builds on."
verify = "In the locally served build: G then S adds a key that appears on the canvas and in the tree; the add flow's id field holds a minted id, an edited id is the one committed, and an id already in the design is refused; the status strip shows the cursor's model coordinates as 'x 12.34 y -5.67' and the zoom as a whole percent, which follows wheel zoom; one wheel notch zooms x1.1 keeping the point under the cursor fixed; zoom stops at 10% and at 2000%; F with a selection fits it, and with none fits the whole board, each with 24 px padding; selecting either selects both, Delete removes it; a switch to Outline and back keeps zoom and pan, and so does a reload; a key at +15 deg tilts counter-clockwise on screen; a row posted unplaced is not drawn; a switch whose set is late shows the snapshot grayed after the grace; an automated check on current snapshots finds every canvas mark at 3:1 contrast in both themes and handles at the canvas hit radius at 50%, 100% and 400%."
