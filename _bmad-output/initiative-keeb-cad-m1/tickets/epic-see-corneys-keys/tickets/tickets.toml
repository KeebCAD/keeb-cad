[[entry]]
id = 7
type = "story"
title = "Layout canvas shows resolved keys and adds groups and slots"
description = "The Layout workspace's 2D canvas, inline SVG drawn by Vue templates (AD-22), draws only the design and story 22's posted Layout set (parts and layout) at one seq, computing no geometry; focus names the Layout workspace. Each part rectangle is placed at its slot's frame with translate(x, y) rotate(rot) scale(mirrored ? -1 : 1, 1), in model mm inside the viewport's y-flipped group, strokes non-scaling (AD-22); handles sit only at posted frame and anchorAt points. After a workspace switch the last snapshot draws as is and grays, with the status strip showing updating, if the set hasn't arrived within the switch grace (~200 ms). It draws placed keys as keycaps with group frames and anchor links in both themes; G adds a group, S a slot, Ctrl+D duplicates, Delete deletes, each through the design store; click selects, and 23.8's tree slide-out lists the nodes on a Tree wrapper over Reka's tree in ui and stays synced; wheel zoom to cursor, middle or Space drag and trackpad pan, F fits; the viewport is a service stored per design id in localStorage and shared across 2D workspaces, and it feeds the status strip's cursor coordinates (model mm) and zoom, added to 23.8's strip. Its canvas, selection and viewport are what every later 2D story builds on."
verify = "In the locally served build: G then S adds a key that appears on the canvas and in the tree; the status strip shows the cursor's model coordinates and the zoom, which follows wheel zoom; selecting either selects both, Delete removes it; a switch to Outline and back keeps zoom and pan, and so does a reload; a key at +15 deg tilts counter-clockwise on screen; a switch whose set is late shows the snapshot grayed after the grace; an automated check on current snapshots finds every canvas mark at 3:1 contrast in both themes and handles at the canvas hit radius at three zoom levels."
covers = ["R1", "R6"]
after = ["23.8", 22]
hitl = false
risk = "medium"

