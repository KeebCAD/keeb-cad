title = "Copy design records provenance"
description = "A copyDesign operation makes a new design with a new name and id that records its source design, revision and source licence in meta, keeps every other id, saves it as its own design and leaves the original untouched; it stays available in read-only mode; Save to file keeps the same design and id. epic-editor-shell's Copy design… and Design info use it; epic-parts-and-pcb builds Corney wireless with it."
