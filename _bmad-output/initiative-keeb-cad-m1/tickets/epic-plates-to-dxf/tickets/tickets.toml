# Stories of epic-plates-to-dxf. Table order is build order.

next_id = 4

[[entry]]
id = 2
type = "story"
title = "Part picker places parts"
description = "P adds a slot as a child of the selected group (or the selected slot's group, else the root), appended after its last sibling with no offset, through the add flow's optional id field pre-filled with a minted id (13.24), with the Part picker open beside it; picking the part is a separate undo step (AddSlot, then 14.7's setPart). It extends 14.5's Part field so it opens the same picker, searchable by name; it lists library parts (name and version) and design-local parts (a dash for version), each row previewing the part's rectangle only (the M1 envelope); cutouts join the preview when the plates story types them, footprints with epic-parts-and-pcb; Enter picks; changing a part is one undo step. Uses 14.7's library parts and setPart."
verify = "With a group selected, P then typing 'choc' and Enter adds a Choc v2 slot as that group's last child with no offset, in two undo steps (the first undo clears the part, the second removes the slot); with nothing selected the slot lands in the root; a design-local part is listed with a dash for version; switching the slot to the M2 screw and undoing restores Choc v2."
covers = ["R6", "R8"]
after = ["14.5", "14.7", "13.24"]
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "Export registry reports available or blocked"
description = "pipeline's export registry: each stage registers its exports, each declaring the slice it reads as a set of ids (derived like its input-slice hash, AD-11) and reporting available or blocked: a model violation of severity error blocks it when any of the violation's ids is in that set, reported as blocked: <kind> naming the first id; warnings never block; the KiCad board is exempt (AD-15); blocking on stale or failed background outputs arrives with epic-routing-and-fab. pipeline posts the whole registry status at every seq: exports { seq, entries: { id, label, availability: 'available' | { blocked: reason } }[] }. Export is an action that asks pipeline for the bytes through workers and hands them to storage or a download; an export of the same file and app version gives the same bytes. The Export menu (plates to DXF, to plan) lists it; plates, pcb, case and firmware register their exports."
verify = "With two test exports reading disjoint id sets, a model error on an id in one set blocks only that export, its reason naming the kind and the first id, and it becomes available once the error is fixed; a warning blocks neither; the exports message posted at each seq lists both entries; running the Export action twice on the same file gives byte-identical bytes."
covers = ["R7"]
after = ["23.3"]
hitl = false
risk = "low"
