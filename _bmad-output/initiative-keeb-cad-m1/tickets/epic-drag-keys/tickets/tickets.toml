# Stories of epic-drag-keys. Table order is build order.

[[entry]]
id = 1
type = "story"
title = "Drags and nudge bursts preview, then run one command"
description = "editor's preview service (a UI-state di service, spine AD-2 and Editor state): while a drag or nudge burst lasts it holds the moved nodes' preview position for the canvas, and nothing else changes (no revision, no live stage, no autosave); the drop or the burst's end runs one command, one undo entry; cancel runs nothing. A burst ends after 600 ms idle, on any other key or on any pointer action. run's optional { seq } and the store's stale check: a command computed from a snapshot carries that snapshot's seq and is refused with stale { seq, latest } when it is not main's latest. The editor holds a drag or nudge start until the snapshot at main's latest seq has arrived; a stale rejection that still happens snaps the preview back with the toast 'the layout changed, drop again' (16.1's Toast). Proven with a test command; 15.4 and 15.5 drive it."
verify = "Tests with fake timers: a test drag's preview moves its nodes with seq and revision unchanged and no autosave; its drop leaves one undo entry; cancel leaves the design and the stack unchanged; three nudges 599 ms apart run one command, and a gap of 600 ms and of 601 ms each end the burst; another key and a pointer action each end it; a command carrying an older seq is refused as stale with seq and latest and the design is unchanged; a start made before the latest snapshot arrives waits for it; a stale rejection snaps the preview back and shows the toast."
covers = ["R4"]
after = ["14.1", "16.1"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Move and rotate commands with chain rule and write-back"
description = "Move carries per-node deltas already in each node's anchor frame plus the snapshot's seq, and adds each delta to the node's offset; editor converts the world delta with one shared helper in geometry (its compose inverted) from the posted frame and anchorAt, moving only selected nodes with no selected ancestor. In a chain the whole delta goes to offset.position (an offset carries to later siblings); compensate subtracts the move expressed in the next sibling's anchor frame, so its world position stays, and is a no-op with no next sibling, in a free group, or when the next sibling has an explicit anchor. Rotate changes the rotation's deg term. Write-back edits only a top-level additive literal, with its sign (a - 2mm edits -2); a factor or divisor never qualifies, so a term is appended; the literal rounds half away from zero to 0.01 mm or 0.1°, prints in shortest decimal form with no trailing zeros, never -0 or an exponent, and a term rounding to zero is removed. Each drop or burst end is one command and one undo step, through 15.1's preview service and stale check; 15.4 and 15.5 wire drag, nudge and the rotation handle to these commands."
verify = "Headless tests show a chain move changing only offset.position; compensate leaving later siblings in place, and doing nothing with no next sibling, in a free group and before an explicitly anchored sibling; 5mm becoming 5.37mm; a - 2mm moved by 0.5 mm becoming a - 1.5mm; 2 * a getting a term appended; a term reaching 0 removed; 0.005 mm rounding to 0.01mm and -0.004 mm to no term; a rotated node's delta landing in its anchor frame; one undo restoring each."
covers = ["R7"]
after = ["13.4", "14.2"]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Re-anchor keeps the node in place"
description = "A re-anchor command moves a node's anchor to another target while keeping its world placement, flattening its offsets to plain numbers relative to the new anchor at full precision, then rounded to 0.01 mm and 0.001°, rotation normalised to (-180, 180]; it carries the snapshot's seq (15.1's stale check) and is one undo step; a cycle-closing target is rejected through model/main's wouldCycle. Unlike 13.3's setAnchor, which keeps the offset as written; resetting to the default anchor is setAnchor with no target. 15.6's anchor picker calls it."
verify = "Re-anchoring a rotated thumb key to another key leaves its resolved frame unchanged within 0.01 mm, its offsets plain numbers rounded to 0.01 mm and 0.001°, and one undo restores the expressions; a resulting rotation of 190° is written as -170; a cycle-closing target is rejected naming the cycle; a re-anchor from an older seq is refused as stale."
covers = ["R1", "R7"]
after = [2]
hitl = false
risk = "low"

[[entry]]
id = 4
type = "story"
title = "Keys and groups drag by the chain rule"
description = "Left-drag on a key, or on a group frame's tab, previews through 15.1's service and on drop runs 15.2's move command once; Alt-drag compensates, Ctrl-drag where Alt collides; box select and Shift box select; a multi-selection moves only its roots; Esc cancels a drag and runs nothing. A drag starts only once the snapshot at main's latest seq has arrived; a stale drop snaps back with the toast. Alt-drag and the Ctrl chords are checked by hand in Chromium and Firefox."
verify = "Dragging Corney's thumb-home moves thumb-reachy with it and writes + 0.37mm into its offset; Alt-drag leaves thumb-reachy still; one Ctrl+Z undoes each; Esc mid-drag leaves the design unchanged; a drag begun while a newer snapshot is pending waits for it; a drop refused as stale snaps the keys back and shows 'the layout changed, drop again'; the manual chord check is recorded for both browsers."
covers = ["R1", "R8"]
after = ["13.7", 2, "16.4"]
hitl = true
risk = "high"

[[entry]]
id = 5
type = "story"
title = "Rotation handle, rotate and nudge keys"
description = "A selected key or group shows the rotation handle about its pivot with a delta readout, Shift snapping 5°; R rotates clockwise and Shift+R counter-clockwise by the rotate step; arrows nudge by the arrow, Shift and Ctrl steps, Alt+arrow compensates; a burst previews through 15.1's service and runs one command when it ends; the keys act only while the canvas has focus. The nudge-step control in the status strip: four expression fields (arrow, Shift, Ctrl step; rotate step), defaults 0.25 / 1 / 0.05 mm and 1°, held by a UI-state di service in editor and persisted per design id in localStorage like the viewport; parameters are allowed; a step that isn't a positive length (a positive angle for rotate) is refused and the previous value kept. All through 15.2's commands."
verify = "Dragging the thumb group's handle 5° writes 5 into its rotation and one undo restores it; R then Shift+R returns to the start; three arrow presses within 600 ms are one undo step; with a field focused, arrows and R do nothing on the canvas; an arrow step of 0mm, of -1mm and of 5deg is refused and the previous step kept, while 0.01mm and ks / 4 are accepted; the steps survive a reload for that design; a nudge refused as stale snaps back with the toast."
covers = ["R2", "R8"]
after = [4]
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Anchor picker and re-anchor"
description = "Clicking an anchor field enters pick mode: candidate attach points light, a target node and a 3x3 attach point are picked on the canvas or in the grid, or by typed id and Tab, Enter confirms; cycle-closing targets are dimmed with 'would create a dependency cycle', decided by model/main's wouldCycle; re-anchoring calls 15.3 and shows its toast; resetting to the default anchor runs 13.3's setAnchor with no target. No drag-to-anchor."
verify = "Anchoring the thumb group to a key's bottom-right attach point by keyboard alone leaves the group in place with flattened offsets and the toast; a target that would close a cycle is dimmed with its reason and cannot be confirmed; reset to default anchor keeps the offset as written."
covers = ["R3", "R8"]
after = [5, 3]
hitl = false
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "UX assumptions reviewed after the Corney layout rebuild"
description = "With Sergii, after rebuilding Corney's key layout in the locally served editor, a bmad-ux Update run on the editor spines (epic-platform-baseline/ux-editor/) decides each [ASSUMPTION] in EXPERIENCE.md › Open Items that the chrome and Layout workspace exercise (about 22 of 28) and the five facilitator-proposed bundles (output state, violations, file lifecycle, shortcuts, expression editing). Each remaining assumption is recorded with the epic whose workspace exercises it. Changes to built behaviour become new stories in the owning epic."
verify = "EXPERIENCE.md's Open Items list no exercised assumption still undecided, each other one names the epic that will decide it, and the five bundles are confirmed or changed, with the run's decisions in its memlog."
covers = ["R8"]
after = [6]
hitl = true
risk = "low"
