type = "story"
title = "A new design autosaves and reopens from the browser"
description = "storage gets its interface (save, load, listVersions, listDesigns) and its layers (spine AD-13 Storage layers, 2026-11-07): the retention rules, the save that prunes and retries, and the mapping of a caught error to a StorageError are pure code over the storage backend (StorageBackend: write(version, replaces), versions(designId), designs(), read(versionId), delete(versionIds), each one transaction; write allocates the next global save counter, which is the VersionId), run on Node; the browser backend (BrowserBackend, src/browser/) implements it on Dexie (a new Stack dependency; this story adds the dependency-cruiser path rule that only storage/src/browser/ imports dexie, with its violation fixture), taking IDBFactory and IDBKeyRange through di; the memory backend (MemoryBackend, src/testing/) is the test double; one backend contract spec runs against both. storage gains its own Vitest config running only src/browser/ in Chromium and Firefox, and the root config an inline Node project for every other storage spec (as di's root), so Stryker keeps mutating them; this story adds negated entries for the browser backend's files and the contract helper to stryker.config.json's mutate list (the 2026-11-05 Decision in 23.13's plan, story-the-test-harness-enforces-agents-md-s-test-rules-plan.md; the guard asks before the edit), and the memory backend stays mutated; listDesigns returns the stored designs newest first by storage's save counter (design id, name, revision, last saved; last saved is a display time, never an order). The saved unit is the design bundle (AD-1, AD-13): the design file, the routing file and the fingerprints file, each tagged with its revision and both empty until 7.1 and 7.2 (epic-see-corneys-keys Decision 2026-11-02), written atomically by main's storage, its one writer. design's Committed holds the derived files (story 3); This story adds design.acceptDerivedFiles and the store's accept event: workers hands it a pipeline post accepted only at main's latest seq, and it replaces the whole Committed and emits the accept event (no new seq or revision). storage's load(id) goes through design-file's migrateBundle (one format-version for the bundle, AD-8) and returns AsyncResult<LoadedBundle, LoadError | not-found | storage-unavailable>, LoadedBundle holding the migrated bundle and the bundle's text as read (BundleTexts). save(entry, texts, reason) always takes text with its entry (id, name, revision) and VersionReason and never parses; autosave writes the text with writeBundle first. Each storage method returns only the StorageError kinds it can raise: save storage-unavailable or quota-exceeded, listVersions and listDesigns storage-unavailable (spine 2026-11-07). The one load flow (a di service in commands, AD-13) runs storage's load, then replaceDesign, and reports the outcome (16.1 shows it); before a load whose replaceDesign empties a saved derived file that was unreadable or invalid, which the flow learns first from design's new pure query emptiedFiles(bundle) (the same per-file check replaceDesign runs, through read-derived-file.ts; a missing file needs no reset point; spine AD-13, 2026-11-07), it keeps the bundle as read as a named point with reason reset, saved by handing LoadedBundle's text back to save unchanged, so the autosave inside replaceDesign cannot replace it first (spine 2026-11-05); when that save fails, the load stops before replaceDesign: the stored bundle stays untouched, the open design stays open, and the flow's notice reports the save's StorageError (storage-unavailable or quota-exceeded); at launch, with no design open, story 7 opens a new design instead, which autosave treats like any New design (spine AD-13, 2026-11-07). app's autosave is a di service that subscribes to design's commit and accept events and saves design's bundle as it is at that moment through storage, not through the crossing, and never waits for the worker's echo. Autosave after every applied command and acceptance, 20 rolling versions, one per design revision (a later save at the same revision replaces that version); storage.save prunes for every reason: on a quota refusal it drops the saving design's oldest autosave version, never that design's newest version, and retries, so quota-exceeded means that design has no rolling version left but its newest, and autosave and the reset save report failure only then (spine AD-13, 2026-11-07). A version is identified by its save counter, so two named points at one revision never collide: same-revision replacement applies only among autosave versions, so a reset point beside an autosave at that revision survives; versions are ordered by a monotonic save counter in storage, never a clock. Autosave holds a failure state (a reactive shallowRef, so app gains its drawn edge to reactive in dependency-cruiser's GRAPH: empty, or a save's StorageError), retries on the next commit or accept event and clears on success; 16.x's banner reads it; at launch, story 7's new design's failed autosave sets it (23.7's plan, 2026-11-07). workers holds the violations posted as issues by story 4's worker, empty until 13.17 or 13.18 adds the first kind; story 8's status strip reads them. Story 7 reopens the last design through listDesigns."
verify = "A test runs a command, finds the design bundle autosaved in browser storage, reopens it through load and replaceDesign byte-identical, each file of the bundle round-tripping; an accepted derived file autosaves with no edit after it, replacing that revision's rolling version rather than adding one; a load whose routing file is unreadable, and one whose routing file parses as KDL but fails its schema, each keeps a reset version holding it as read, and the autosave at that revision leaves it in place; emptiedFiles reports routing as unreadable, invalid and missing for those three bundles and nothing for a bundle whose files all parse, and a bundle without routing handed to the load flow saves no reset version (storage keeps all three files, Sergii 2026-11-07, J1); listVersions orders two saves made at the same fake time by save order, and listDesigns lists two designs saved at the same fake time with the later save first; a save refused for space sets autosave's failure state to quota-exceeded and the next successful save clears it; load of an id not stored returns not-found naming that id; with a registered IDBFactory whose open throws a SecurityError, load, save, listVersions and listDesigns each return storage-unavailable with the DOMException's name and text, in Chromium and Firefox; the mapping's Node spec gives quota-exceeded for a QuotaExceededError and for an AbortError whose inner is one, and storage-unavailable for the raw DOMException, an OpenFailedError and a DatabaseClosedError each with a SecurityError inner, the message from the inner when present; the backend contract passes on the memory backend on Node and on the browser backend in both browsers, its counter only rising and a write's put and replaced deletes landing together; two named points at one revision are both kept; dependency-cruiser rejects dexie imported outside storage/src/browser/; a load whose reset save is refused for space with no autosave version left leaves the stored bundle