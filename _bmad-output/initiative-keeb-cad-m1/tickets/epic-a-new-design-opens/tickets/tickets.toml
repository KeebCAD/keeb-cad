title = "The ui foundation renders in the workbench"
description = "packages/ui per AD-26: Tailwind 4 @theme tokens from DESIGN.md (Frappé and Latte, the 4px grid aliases, radii 2/4/8), lint against arbitrary values, the OS-default theme with the localStorage override and the inline index.html script, self-hosted JetBrains Mono, the Icon component on @lucide/vue, Button, Kbd and a Tabs wrapper over Reka's tabs, the number formatter, and the hotkey layer on @zag-js/hotkeys taking plain { id (a command id), hotkey } data (story 7 feeds it from the register) with the shortcut rules (no unmodified or Shift-only symbol keys except a character-matched alias, no Alt+letter, no swap-pair letters). The workbench Vite entry renders every component in every state in both themes; browser-mode component tests mount the same state files."
