type = "story"
title = "A new design autosaves and reopens from the browser"
description = "storage gets its interface (save, load, listVersions, listDesigns) and the browser autosave backend. The saved unit is the design bundle (AD-1, AD-13): the design file, the routing file and the fingerprints file, each tagged with its revision and both empty until 7.1 and 7.2 (epic-see-corneys-keys Decision 2026-11-02), written atomically by main's storage, its one writer. design's bundle holds the derived files: set from migrateBundle's result or emptyDerivedFiles; workers hands a pipeline post accepted only at main's latest seq to design.acceptDerivedFiles; storage's load and a version switch go through design-file's migrateBundle (one format-version for the bundle, AD-8), which fills a missing derived file empty. app's autosave subscribes to design's commit event and saves design's bundle as it is at that moment through storage, not through the crossing, and never waits for the worker's echo. Autosave after every applied command, 20 rolling versions; failure is reported only when no rolling version is left to prune. workers holds the violations posted as issues by story 4's worker, empty until 13.3; story 8's status strip reads them. Story 7 reopens the last design through listDesigns."
