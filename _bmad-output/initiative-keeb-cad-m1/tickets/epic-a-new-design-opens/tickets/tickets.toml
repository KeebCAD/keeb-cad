[[entry]]
id = 2
type = "story"
title = "Commands run through the design store"
description = "design's DesignStore (AD-2): the one di service holding the design, its seq and its revision as one Committed value in one shallowRef (current: Option<Committed>), and the only writer of it (run and replaceDesign here; undo and redo join in epic-change-a-parameter); it resolves eagerly at startup. defineCommand and defineAction (command id, translatable label, input schema, availability check over the read-only design, apply step) and design's commands and actions di multi tokens; the store refuses a duplicate command id. run parses every input with its Valibot schema to a fresh copy, changes the design through DesignPatcher (a di service registered by design's main module and design/worker's module: its own new Immer({ autoFreeze: true }) instance, with Immer's global enablePatches(); change(design, edit) returns Result<Changed, Rejection> and keeps a returned Rejection outside the Immer producer; apply(design, patches) returns the patched, frozen design), calls model/main's checkStructure (Result<void, Rejection>, ok until 13.3; its own file, main.ts only re-exports), and returns Result<void, Rejection>. replaceDesign takes unknown (the bundle migrateBundle already migrated, story 3), parses (design's parse turns a Valibot parse into a Result with SchemaIssue paths) and deep-freezes with deepFreeze, returning Result<void, DesignInvalid>. The store mints the seq, computes the revision with hashing's synchronous hash(value), provisional until the mirror-hash spike (the plan picks the function and adds its Stack row), parsed with the Revision schema, and emits its commit event (each commit's patches, seq and revision). Result and Option come from result (11). Frozen<T> and Writable<T>; in schema: Id and its schema, Revision, SchemaIssue, Rejection (input-invalid with SchemaIssue paths, unavailable, stale, model kinds: none until 13.3) and DesignInvalid (spine 2026-11-03). design/worker exports DesignPatcher and its module (story 4's worker mirror uses them). Main's container is a di container built in app's main.ts, and a second registration throws DuplicateRegistrationError; story 7 provides it to components. The design's meta section (design id, name, form; AD-8's first section) is the store's first real data: its Valibot schema in schema, and the Design type, the store and replaceDesign's parse are built on it, so story 3 extends them to the other sections instead of replacing a placeholder. Built to AGENTS.md's code layout and test rules (2026-11-03). Proven with a test-only command that renames the design; newDesign and id minting stay in story 3, the gap, Length and Expression in 13.2, defaultPart and ref(kind) in 13.18, provenance in 22.1; the stale-seq check waits for the first drop or nudge command (epic-drag-keys)."
verify = "Unit tests, each arranging only what it uses: a test command changes the design and the result is deeply frozen with no proxy; its caller's input stays unfrozen; a Vue reactive input is stored as plain data; a test command returning a Rejection leaves the design untouched: no ref write, no commit event, seq unchanged; an input that fails a runtime-only constraint (a value the types accept) is refused as input-invalid with the failing issue's path; an unavailable command is refused as unavailable; a duplicate command id fails at startup; DesignPatcher.apply of a command's patches to the previous design gives the new one, deeply frozen; replaceDesign accepts a valid meta-only design deeply frozen and refuses one with an unknown form as design-invalid at ['meta','form','type']; the revision is hash(design). Type-only tests: Writable<Design> is assignable to Mutable<Design> and a handle's id is inferred as a literal (design); a nested write to a Frozen<Design> fails to compile (schema). schema's own test: idSchema refuses an id that is not kebab-case."
covers = ["R2"]
after = [11]
hitl = false
risk = "high"

