[[entry]]
id = 4
type = "story"
title = "The model worker mirrors the design"
description = "messaging's generic machine (one dispatcher per side, transfer lists, the seq gate, stale rejection) and protocol's first messages: the whole design, patches with (epoch, seq), focus, issues and stage-started (AD-11). workers spawns the model worker; app's model.worker.ts builds its container from the worker modules, awaits autoLoad() and calls createDerivations(design/worker's mirror, library). workers sends the whole design with the derived files design's bundle holds (none until 5 fills it through acceptDerivedFiles) at worker start and on replaceDesign, then each applied command's patches; newDesign's caller sends the empty derived files it sets with newDesign's patches, as undo and redo send the files they restore; pipeline echoes the derived files it holds at every seq (AD-13); pipeline receives them and applies them in order through design/worker's writer (2's DesignPatcher.apply), after deep-freezing each whole design it receives with deepFreeze, so the mirror is deep-frozen. The worker posts issues (empty until 13.3) and stage-started, each echoing its seq; workers drops a post from an older seq or another epoch. On a crash (the worker's error event or a message that fails to deserialize) workers restarts the worker with a new epoch and the whole design. The mirror's hash check waits for its spike (spine Open Questions)."
verify = "Tests in Chromium and Firefox: after a command the worker's mirror equals main's design and is deeply frozen; a post from an older seq and one from another epoch are dropped; a crashed worker restarts with a new epoch and the whole design; only plain data crosses; the main entry's graph never reaches pipeline (fence)."
