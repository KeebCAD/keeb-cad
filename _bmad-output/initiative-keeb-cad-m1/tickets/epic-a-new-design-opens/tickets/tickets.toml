[[entry]]
id = 1
type = "story"
title = "The thread plumbing matches the spine"
description = "Brings the workspace to the 28-package graph of AD-10 and AD-25, structure only, no behaviour change. Scaffolds stubs with package exports for expr, messaging, hashing, di, schema, design, design-file, protocol, commands and workers; adds model's root, model/main and model/worker entries and design/worker. Moves the Vue app from app/ to packages/editor; app becomes the composition package with the four thread entries (main.ts, model.worker.ts, case.worker.ts, routing.worker.ts). Encodes every drawn AD-10 edge as an imports-only rule, plus the entry fences: main never reaches blueprint, pipeline, a stage or the sandbox; no worker reaches ui, editor, di/vue or vue; only the model worker's entry imports model/worker; only it and pipeline import design/worker; the case worker never reaches model; only editor imports di/vue; di and reactive are open to every package; library/worker only from the worker entries; stages never import each other; drc is a checker; fixtures imports only schema. Removes worker-imports-no-reactive, routing's stage-exception wording and any editor -> pipeline route; moves the immer fence to design. Each rule has a violation fixture."
verify = "pnpm check passes; each edge rule and entry fence rejects its violation fixture; sh tooling/verify-checks.sh passes."
covers = []
after = []
hitl = false
risk = "medium"

