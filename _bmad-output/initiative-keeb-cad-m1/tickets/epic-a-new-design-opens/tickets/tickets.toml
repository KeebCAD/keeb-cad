[[entry]]
id = 13
type = "story"
title = "The test harness enforces AGENTS.md's test rules"
description = "Builds the tooling behind AGENTS.md's Tests rules (2026-11-04, adapted from the ninja-testing plugin, ~/Downloads/javascript-ninja-testing-skills, MIT: keep its notice in any file that copies its code). Three Claude Code hooks in a new .claude/settings.json, with no config file (the commands are constants): a guard that denies snapshot and baseline updates (vitest -u, playwright --update-snapshots, edits to __snapshots__/ and *-snapshots/), --no-verify, force push, deleting a spec and changing Stryker thresholds from the command line, and asks before edits to runner or mutation config and before a Stryker disable comment; a stop hook that asks for the whole pnpm test once when tests or logic changed; a PostToolUse hook that runs ESLint (no cache) on each edited file ESLint covers and returns the violations. Ports the needed test-lint rules into the ESLint config, each with a spec in tooling/lint, and makes getByTestId and data-testid errors; replaces the five testId uses (editor-shell, empty-editor) with getByRole('main') and getByText. Turns on Vitest sequence.shuffle and runs pnpm lint with --cache in node_modules/.cache/eslint/, with a comment that type-aware rules would make the cache stale. Adds Stryker on Node projects: mutate lists the pure files of the six priority packages, never code that needs a browser or I/O (storage's IndexedDB backend; those are proven by a toggled bug), pnpm test:mutation, thresholds high 90 low 80 break 90, and a CI job that gates every PR. Adds a bmad-code-review lens override: a context-free Sonnet subagent, when the diff touches *.spec.* or *.test.*, running ninja's test-reviewer checks (name against expects, implementation coupling, what is mocked, level, honest arrange/act/assert, determinism, undocumented decisions) with no finding floor ('checked N tests, no findings' is a full answer), every finding quoting the test name, the expect line and the check number verbatim so triage drops any quote not in the diff. Adds a bmad-build override: the plan carries a boundary table (below, on, above per threshold, sorted production bugs, rules, module boundaries, glue) with a level column per row, frozen as acceptance at plan approval, its rows outside the 3000-token plan cap. Ports two skills against AGENTS.md: mutation-loop (scoped runs, a verdict per survivor) and flaky-triage's diagnosis steps 1-6 (read the log, classify, reproduce by seed, name the source, refuse the four fixes)."
verify = "pnpm check passes with shuffle on and the ported lint rules, each failing its own violation case in tooling/lint; no getByTestId or data-testid remains; pnpm test:mutation runs and the CI job fails a PR below break 90; a spec edit with a lint violation gets the ESLint output back from the hook; the guard denies vitest -u, playwright --update-snapshots and git push --force, each shown once; the lens fires on a spec diff and stays silent on a docs-only diff."
covers = []
after = [12]
hitl = false
risk = "medium"

