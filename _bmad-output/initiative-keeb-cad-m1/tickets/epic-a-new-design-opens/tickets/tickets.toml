iteBundle, readBundle, replaceDesign, writeBundle. Generic per-entry checks wait for 13.2; the deep freeze stays in design's unit tests. Story 2's meta-only replaceDesign test moves to a design with both sections (meta and layout). 13.2 fills the layout section and adds the gap to meta; story 5 stores the bundle and builds the load flow."
