# Stories of epic-a-new-design-opens. Table order is build order.
# Split from epic-see-corneys-keys 2026-11-02: entries 13.19, 13.10, 13.1, 13.20, 13.14, 13.11, 13.12, 13.15 moved here as 1-8.

next_id = 10

[[entry]]
id = 1
type = "story"
title = "The thread plumbing matches the spine"
description = "Brings the workspace in line with the model-worker spine (AD-10, AD-11, AD-25), structure only, no behaviour change. Scaffolds @keeb-cad/protocol as a stub (the one main <-> model-worker message union; imports only model and reactive; only pipeline, editor and storage import it). model gets per-thread subpath exports, model/main and model/worker, with shared pure parts (types, schemas) importable from both; each package that serves a thread exposes its partial as <package><Thread>Services from that thread's subpath. Adds the per-entry fences: main's graph never reaches blueprint, a stage package or the sandbox runtime; a worker's graph never reaches ui or vue. Rewrites 13.9's rules that contradict the spine: the no-reactive rule covers only case and routing worker code; the editor reaches pipeline only through protocol messages, never by import; model may import blueprint. The blueprint, library/worker and authoring fences stay with 13.17 and 13.21. Each new or rewritten rule has a violation fixture."
verify = "pnpm check passes; each new or rewritten fence rejects its violation fixture; sh tooling/verify-checks.sh passes."
covers = []
after = []
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Commands run through the register"
description = "model's register concept: the design service holding the authored sections in a shallowRef; defineCommand and defineAction (name, input schema, availability check over the read-only design, apply step); the command register service built from the root container's appended commands array, refusing duplicates; run parses every input with its Valibot schema to a fresh copy, applies it through one new Immer({ autoFreeze: true }) instance with enablePatches(), returning the command's patches, keeps a returned Rejection outside the Immer producer, runs the structural-check hook, and returns { ok: true } or a Rejection; replaceDesign takes unknown, migrates (none yet), parses and deep-freezes. Frozen<T> and Writable<T>; Id, Length, Expression and ref(kind) Valibot helpers. The register's file is the one place that sets up Immer and also exports applyDesignPatches (story 4's worker mirror uses it). The root container in main.ts merges main's partials (modelMainServices from model/main, AD-25), none of which holds commands, with the disjoint-getTokens test over every thread's partials; story 7 provides it to components. The design's meta section (design id, name, form; AD-8's first section) is the register's first real data: its Valibot schema in model, and the Design type, the design service and replaceDesign's parse are built on it, so story 3 extends them to the other sections instead of replacing a placeholder. Proven with a test-only command that renames the design; newDesign and id minting stay in story 3, the gap in 13.2, provenance in 22.1."
verify = "Unit tests: a test command changes the design and the result is deeply frozen with no proxy; its caller's input stays unfrozen; a Vue reactive input is stored as plain data; a returned Rejection leaves the design untouched; an invalid input is refused with its path; an unavailable command is refused; a duplicate command name fails at startup; every exported command is registered; a nested write outside apply fails to compile (type test); a command's patches applied through applyDesignPatches to the previous design give the new one; every thread's partials' tokens are disjoint; replaceDesign accepts a valid meta-only design deeply frozen and refuses one with an unknown form, naming the path."
covers = ["R2"]
after = [1]
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "A new design writes and reads back byte-identical"
description = "model gets the KDL v2 schema skeleton for the layout section, after story 2's meta in AD-8 order (the layout a tree, AD-23), declared in Valibot; every other authored section is added in its AD-8 position by the story that introduces it, never as an empty placeholder here. The design file holds the authored sections only (routing and fingerprints are separate files of the design bundle, AD-1). Also the design file's canonical writer, id minting and the newDesign command (design id, name, form split with a reversible board) registered through story 2's register; reading a file goes through model's migrateBundle (one format-version for the whole bundle, AD-8), then replaceDesign, which only parses, deep-freezes and writes the already-current design; newDesign's caller sets the empty derived files through model's emptyDerivedFiles(revision) (AD-1). Layer-3 generic checks over every registered command, so later stories' commands are covered automatically: after run the design is deeply frozen with no proxy and the caller's input unfrozen, and file write -> read round-trips. Story 2's meta-only replaceDesign test moves to a design with both sections (meta and layout). 13.2 fills the layout section and adds the gap to meta; story 5 stores the file."
verify = "A test creates a design by command, writes it, reads it back through replaceDesign and writes again; the two files are byte-identical and the read design is deeply frozen; a file with sections out of order is rewritten in AD-8 order; the generic checks run over every registered command."
covers = ["R1"]
after = ["1.1", 2]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "The model worker mirrors the design"
description = "reactive's generic protocol machine (epoch and seq, one dispatcher per side, transfer lists) and protocol's first messages: the whole design, patches with (epoch, seq), focus, issues and stage-started (AD-11). Main spawns the model worker from main's partials; the worker entry builds its own container from modelWorkerServices. Main sends the whole design with the derived files it holds (none until 5 adds the derived-files service) at worker start and on replaceDesign, then each applied command's patches; newDesign's caller sends the empty derived files it sets with newDesign's patches, as undo and redo send the files they restore; pipeline echoes the derived files it holds at every seq (AD-13); the worker applies them in order through 2's applyDesignPatches, so its mirror is deep-frozen. The worker posts issues (empty until 13.3) and stage-started, each echoing its seq; main drops a post from an older seq or another epoch. On a crash (the worker's error event or a message that fails to deserialize) main restarts the worker with a new epoch and the whole design. The mirror's hash check waits for its spike (spine Open Questions)."
verify = "Tests in Chromium and Firefox: after a command the worker's mirror equals main's design and is deeply frozen; a post from an older seq and one from another epoch are dropped; a crashed worker restarts with a new epoch and the whole design; the main entry's graph never reaches pipeline (fence)."
covers = []
after = [3]
hitl = false
risk = "high"

[[entry]]
id = 5
type = "story"
title = "A new design autosaves and reopens from the browser"
description = "storage gets its interface (save, load, listVersions, listDesigns) and the browser autosave backend. The saved unit is the design bundle (AD-1, AD-13): the design file, the routing file and the fingerprints file, each tagged with its revision and both empty until 7.1 and 7.2 (epic-see-corneys-keys Decision 2026-11-02), written atomically by main's storage, its one writer. model/main's derived-files service holds the derived files: set from migrateBundle's result or emptyDerivedFiles, replaced by a pipeline post only at main's latest seq; storage's load and a version switch go through migrateBundle (one format-version for the bundle, AD-8), which fills a missing derived file empty. Autosave writes the design plus what the service holds at that moment and never waits for the worker's echo. Autosave after every applied command, 20 rolling versions, through the crossing (reactive's protocol machine and protocol's messages) with plain values only; failure is reported only when no rolling version is left to prune. Main holds the violations posted as issues by story 4's worker, empty until 13.3; story 8's status strip reads them. Story 7 reopens the last design through listDesigns."
verify = "A test runs a command, finds the design bundle autosaved in browser storage, reopens it through load and replaceDesign byte-identical, each file of the bundle round-tripping; a bundle missing its routing file loads with an empty one tagged with the design's revision; autosave completes while the model worker is stopped; the 21st autosave prunes the oldest; only plain data passes the crossing."
covers = ["R1"]
after = [4]
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "The ui foundation renders in the workbench"
description = "packages/ui per AD-26: Tailwind 4 @theme tokens from DESIGN.md (Frappé and Latte, the 4px grid aliases, radii 2/4/8), lint against arbitrary values, the OS-default theme with the localStorage override and the inline index.html script, self-hosted JetBrains Mono, the Icon component on @lucide/vue, Button, Kbd and a Tabs wrapper over Reka's tabs, the number formatter, and the hotkey layer on @zag-js/hotkeys taking plain { id, hotkey } data (story 7 feeds it from the register) with the register test rules (no unmodified or Shift-only symbol keys except a character-matched alias, no Alt+letter, no swap-pair letters). The workbench Vite entry renders every component in every state in both themes; browser-mode component tests mount the same state files."
