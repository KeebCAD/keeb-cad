[[entry]]
id = 3
type = "story"
title = "A new design writes and reads back byte-identical"
description = "schema gets the KDL v2 schema skeleton for the layout section, after story 2's meta in AD-8 order (the layout a tree, AD-23), declared in Valibot; every other authored section is added in its AD-8 position by the story that introduces it, never as an empty placeholder here. The design file holds the authored sections only (routing and fingerprints are separate files of the design bundle, AD-1). Also design-file's canonical writer and migrateBundle, id minting and the newDesign command (design id, name, form split with a reversible board), defined in commands and registered into story 2's register by its concept folder's di module; reading a file goes through design-file's migrateBundle (one format-version for the whole bundle, AD-8), then replaceDesign, which only parses, deep-freezes and writes the already-current design, returning design-invalid with the failing issues' paths (spine 2026-11-03); newDesign's caller sets the empty derived files through design's emptyDerivedFiles(revision) (AD-1). Layer-3 generic checks in app over every registered command, so later stories' commands are covered automatically: after run the design is deeply frozen with no proxy and the caller's input unfrozen, and file write -> read round-trips. Story 2's meta-only replaceDesign test moves to a design with both sections (meta and layout). 13.2 fills the layout section and adds the gap to meta; story 5 stores the file."
verify = "A test creates a design by command, writes it, reads it back through replaceDesign and writes again; the two files are byte-identical and the read design is deeply frozen; a file with sections out of order is rewritten in AD-8 order; the generic checks run over every registered command; a design file whose meta fails its schema is refused as design-invalid with that path. Sergii approves each test name in design-file's first specs against its expects before merge."
