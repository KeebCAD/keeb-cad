[[entry]]
id = 2
type = "story"
title = "Commands run through the register"
description = "design's register concept: the design service holding the authored sections in a shallowRef; defineCommand and defineAction (command id, translatable label, input schema, availability check over the read-only design, apply step); the command register service built from design's commands and actions di multi tokens, refusing a duplicate command id; run parses every input with its Valibot schema to a fresh copy, applies it through one new Immer({ autoFreeze: true }) instance with enablePatches(), returning the command's patches, keeps a returned Rejection outside the Immer producer, calls model/main's structural checks (an empty list until 13.3), and returns Result<void, Rejection>; replaceDesign takes unknown (the bundle migrateBundle already migrated, story 3), parses and deep-freezes, returning Result<void, DesignInvalid>. design also mints the seq, computes the revision with hashing's synchronous hash(value), provisional until the mirror-hash spike (the plan picks the function and adds its Stack row), parsed with the Revision schema, and emits its commit event (each commit's patches, seq and revision). Frozen<T> and Writable<T>; in schema: Id and its schema, Revision, Result, SchemaIssue, Rejection (input-invalid with SchemaIssue paths, unavailable, stale, model kinds: none until 13.3) and DesignInvalid (spine 2026-11-03). The register's file is the one place that sets up Immer and also exports applyDesignPatches (story 4's worker mirror uses it). Main's container is a di container built in app's main.ts, and a second registration throws DuplicateRegistrationError; story 7 provides it to components. The design's meta section (design id, name, form; AD-8's first section) is the register's first real data: its Valibot schema in schema, and the Design type, the design service and replaceDesign's parse are built on it, so story 3 extends them to the other sections instead of replacing a placeholder. Proven with a test-only command that renames the design; newDesign and id minting stay in story 3, the gap, Length and Expression in 13.2, defaultPart and ref(kind) in 13.18, provenance in 22.1; the stale-seq check waits for the first drop or nudge command (epic-drag-keys)."
verify = "Unit tests: a test command changes the design and the result is deeply frozen with no proxy; its caller's input stays unfrozen; a Vue reactive input is stored as plain data; a test command returning a Rejection (its kind cast in the test file) leaves the design untouched: no ref write, no commit event, seq unchanged; an invalid input is refused as input-invalid with the failing issue's path; an unavailable command is refused as unavailable; a duplicate command id fails at startup; a nested write outside apply fails to compile (type test); a command's patches applied through applyDesignPatches to the previous design give the new one; replaceDesign accepts a valid meta-only design deeply frozen and refuses one with an unknown form as design-invalid at ['meta','form','type']; the same design value gives the same revision."
covers = ["R2"]
after = [10]
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "A new design writes and reads back byte-identical"
description = "schema gets the KDL v2 schema skeleton for the layout section, after story 2's meta in AD-8 order (the layout a tree, AD-23), declared in Valibot; every other authored section is added in its AD-8 position by the story that introduces it, never as an empty placeholder here. The design file holds the authored sections only (routing and fingerprints are separate files of the design bundle, AD-1). Also design-file's canonical writer and migrateBundle, id minting and the newDesign command (design id, name, form split with a reversible board), defined in commands and registered into story 2's register by its concept folder's di module; reading a file goes through design-file's migrateBundle (one format-version for the whole bundle, AD-8), then replaceDesign, which only parses, deep-freezes and writes the already-current design, returning design-invalid with the failing issues' paths (spine 2026-11-03); newDesign's caller sets the empty derived files through design's emptyDerivedFiles(revision) (AD-1). Layer-3 generic checks in app over every registered command, so later stories' commands are covered automatically: after run the design is deeply frozen with no proxy and the caller's input unfrozen, and file write -> read round-trips. Story 2's meta-only replaceDesign test moves to a design with both sections (meta and layout). 13.2 fills the layout section and adds the gap to meta; story 5 stores the file."
verify = "A test creates a design by command, writes it, reads it back through replaceDesign and writes again; the two files are byte-identical and the read design is deeply frozen; a file with sections out of order is rewritten in AD-8 order; the generic checks run over every registered command; a design file whose meta fails its schema is refused as design-invalid with that path."
unknown = "The spine's Open Question 'Load failure types' (one LoadError, migrateBundle's Result, a derived file failing its schema) is settled before this story is planned."
covers = ["R1"]
after = ["1.1", 2]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "The model worker mirrors the design"
description = "messaging's generic machine (one dispatcher per side, transfer lists, the seq gate, stale rejection) and protocol's first messages: the whole design, patches with (epoch, seq), focus, issues and stage-started (AD-11). workers spawns the model worker; app's model.worker.ts builds its container from the worker modules, awaits autoLoad() and calls createDerivations(design/worker's mirror, library). workers sends the whole design with the derived files design's bundle holds (none until 5 fills it through acceptDerivedFiles) at worker start and on replaceDesign, then each applied command's patches; newDesign's caller sends the empty derived files it sets with newDesign's patches, as undo and redo send the files they restore; pipeline echoes the derived files it holds at every seq (AD-13); pipeline receives them and applies them in order through design/worker's writer (2's applyDesignPatches), so the mirror is deep-frozen. The worker posts issues (empty until 13.3) and stage-started, each echoing its seq; workers drops a post from an older seq or another epoch. On a crash (the worker's error event or a message that fails to deserialize) workers restarts the worker with a new epoch and the whole design. The mirror's hash check waits for its spike (spine Open Questions)."
verify = "Tests in Chromium and Firefox: after a command the worker's mirror equals main's design and is deeply frozen; a post from an older seq and one from another epoch are dropped; a crashed worker restarts with a new epoch and the whole design; only plain data crosses; the main entry's graph never reaches pipeline (fence)."
covers = []
after = [3]
hitl = false
risk = "high"

[[entry]]
id = 5
type = "story"
title = "A new design autosaves and reopens from the browser"
description = "storage gets its interface (save, load, listVersions, listDesigns) and the browser autosave backend. The saved unit is the design bundle (AD-1, AD-13): the design file, the routing file and the fingerprints file, each tagged with its revision and both empty until 7.1 and 7.2 (epic-see-corneys-keys Decision 2026-11-02), written atomically by main's storage, its one writer. design's bundle holds the derived files: set from migrateBundle's result or emptyDerivedFiles; workers hands a pipeline post accepted only at main's latest seq to design.acceptDerivedFiles; storage's load and a version switch go through design-file's migrateBundle (one format-version for the bundle, AD-8), which fills a missing derived file empty. app's autosave subscribes to design's commit event and saves design's bundle as it is at that moment through storage, not through the crossing, and never waits for the worker's echo. Autosave after every applied command, 20 rolling versions; failure is reported only when no rolling version is left to prune. workers holds the violations posted as issues by story 4's worker, empty until 13.3; story 8's status strip reads them. Story 7 reopens the last design through listDesigns."
verify = "A test runs a command, finds the design bundle autosaved in browser storage, reopens it through load and replaceDesign byte-identical, each file of the bundle round-tripping; a bundle missing its routing file loads with an empty one tagged with the design's revision; autosave completes while the model worker is stopped; the 21st autosave prunes the oldest."
covers = ["R1"]
after = [4]
hitl = false
risk = "medium"

[[entry]]
