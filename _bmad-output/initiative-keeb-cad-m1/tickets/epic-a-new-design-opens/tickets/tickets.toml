[[entry]]
id = 5
type = "story"
title = "A new design autosaves and reopens from the browser"
description = "storage gets its interface (save, load, listVersions, listDesigns) and the browser autosave backend; listDesigns returns the stored designs newest first by storage's save counter (design id, name, revision, last saved; last saved is a display time, never an order). The saved unit is the design bundle (AD-1, AD-13): the design file, the routing file and the fingerprints file, each tagged with its revision and both empty until 7.1 and 7.2 (epic-see-corneys-keys Decision 2026-11-02), written atomically by main's storage, its one writer. design's Committed holds the derived files (story 3); This story adds design.acceptDerivedFiles and the store's accept event: workers hands it a pipeline post accepted only at main's latest seq, and it replaces the whole Committed and emits the accept event (no new seq or revision). storage's load(id) goes through design-file's migrateBundle (one format-version for the bundle, AD-8) and returns AsyncResult<LoadedBundle, LoadError | not-found | storage-unavailable>, LoadedBundle holding the migrated bundle and the bundle's text as read (BundleTexts). save(entry, texts, reason) always takes text with its entry (id, name, revision) and VersionReason and never parses; autosave writes the text with writeBundle first. Each storage method returns only the StorageError kinds it can raise: save storage-unavailable or quota-exceeded, listVersions and listDesigns storage-unavailable (spine 2026-11-07). The one load flow (a di service in commands, AD-13) runs storage's load, then replaceDesign, and reports the outcome (16.1 shows it); before a load whose replaceDesign empties a saved derived file that was unreadable or invalid, it keeps the bundle as read as a named point with reason reset, saved by handing LoadedBundle's text back to save unchanged, so the autosave inside replaceDesign cannot replace it first (spine 2026-11-05); when that save fails, the load stops before replaceDesign: the stored bundle stays untouched, the open design stays open, and the flow's notice reports the save's StorageError (storage-unavailable or quota-exceeded); at launch, with no design open, story 7 opens a new design instead, which autosave treats like any New design (spine AD-13, 2026-11-07). app's autosave is a di service that subscribes to design's commit and accept events and saves design's bundle as it is at that moment through storage, not through the crossing, and never waits for the worker's echo. Autosave after every applied command and acceptance, 20 rolling versions, one per design revision (a later save at the same revision replaces that version); storage.save prunes for every reason: on a quota refusal it drops the oldest autosave version and retries, so quota-exceeded means no rolling version is left, and autosave and the reset save report failure only then (spine AD-13, 2026-11-07). A version is keyed by (design id, revision, reason): same-revision replacement applies only among autosave versions, so a reset point beside an autosave at that revision survives; versions are ordered by a monotonic save counter in storage, never a clock. Autosave holds a failure state (a reactive shallowRef, so app gains its drawn edge to reactive in dependency-cruiser's GRAPH: empty, or a StorageError: a save's, or the storage-unavailable story 7's launch got), retries on the next commit or accept event and clears on success; 16.x's banner reads it and story 7's launch sets it when load or listDesigns returns storage-unavailable. workers holds the violations posted as issues by story 4's worker, empty until 13.17 or 13.18 adds the first kind; story 8's status strip reads them. Story 7 reopens the last design through listDesigns."
verify = "A test runs a command, finds the design bundle autosaved in browser storage, reopens it through load and replaceDesign byte-identical, each file of the bundle round-tripping; an accepted derived file autosaves with no edit after it, replacing that revision's rolling version rather than adding one; a load whose routing file is unreadable keeps a reset version holding it as read, and the autosave at that revision leaves it in place; listVersions orders two saves made at the same fake time by save order, and listDesigns lists two designs saved at the same fake time with the later save first; a save refused for space sets autosave's failure state to quota-exceeded and the next successful save clears it; load of an id not stored returns not-found naming that id; with browser storage that can't be opened, load, save, listVersions and listDesigns each return storage-unavailable with the DOMException's message; a load whose reset save is refused for space with no autosave version left leaves the stored bundle unchanged, keeps the open design open (replaceDesign not run) and reports quota-exceeded, and one whose storage request fails reports storage-unavailable; a reset save refused for space while an autosave version remains drops the oldest autosave version and succeeds; a type-only test shows save's error type holds no not-found; autosave completes while the model worker is stopped; the 19th and 20th autosaves keep every version and the 21st prunes the oldest. Sergii approves each test name in storage's first specs against its expects before merge."
covers = ["R1"]
after = [4]
hitl = false
risk = "medium"
unknown = "Before planning, a spine pass (bmad-architecture) settles storage's library and seam (Sergii, 2026-11-07: a library, not raw IndexedDB, whose transaction auto-commit across an await, atomicity and upgrade rules our code would otherwise own). It answers: (1) which IndexedDB library joins the Stack table, with its version, licence and maintenance checked and a dependency-cruiser rule that only storage imports it (Dexie or idb-keyval; the choice turns on (2)); (2) where the retention rules (pruning on quota, same-revision replacement, the reset point surviving, ordering, listDesigns) live: in pure storage files above the backend interface, run on Node and mutated by Stryker, or in the library's indexed queries inside the browser backend, excluded from Stryker (23.13's Decision) and proven by a toggled bug; Sofia's pick: above the interface, because losing work is the risk Stryker guards, which weakens the case for Dexie's indexes; (3) which side of that interface maps a DOMException to a StorageError (message: the DOMException's name and text), so that the faked can't-open case tests the real mapping: a fake under the browser backend (throwing real DOMExceptions), not a fake of the interface itself; (4) storage gains a browser Vitest project (Chromium and Firefox) beside its Node specs, and one contract spec runs against both the interface's test double (Node) and the browser backend (both browsers), the double kept out of Stryker's mutate glob; (5) the seam's names come from the glossary (AD-13's storage interface and browser backend), never port, which means a MessageChannel port (AD-11). The verify line then changes: a quota refusal is real in Chromium (Vitest's cdp() with Storage.overrideQuotaForOrigin) and storage that can't be opened is faked under the backend. Sofia rewrites the description and verify after the pass. This replaces the Stryker mutate-list question, which (2) answers."

