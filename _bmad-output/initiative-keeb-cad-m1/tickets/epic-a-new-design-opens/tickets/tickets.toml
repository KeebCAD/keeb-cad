[[entry]]
id = 7
type = "story"
title = "The app opens the last design"
description = "app wiring: app's start-main.ts, which main.ts re-exports, adds commands' modules, creates and wires workers, and hands the container to editor, which provides it through di/vue, with lint stopping components importing services as values; the idempotent dev-only devtools.ts and a build check that it never ships; vue-router hash history at /#/design/<id>/<workspace> (the router parses the segment with schema's workspaceSchema; a failed parse or a missing segment opens layout and the URL is replaced to /layout, Decision 2026-11-07); vue-router is the one owner of the open design and workspace; UI state follows it from di services. editor's UiAction mechanism (UiAction classes with statics kind, id, label, input and optional hotkeys, available() and apply(input) with inject(), registered by registerUiAction into editor's uiActions multi token) and editor's one shortcut registry, which merges the store's commands and actions with the UiActions and feeds the hotkey layer from each handle's optional static hotkeys, which design's CommandHandle and ActionHandle gain (read only by editor); every invocation (hotkey, menu, palette) goes through one editor invoke path that builds the input from UI state with a per-entry input builder where needed, {} otherwise; the Firefox Playwright project. At startup the editor draws what the design itself gives and shows each stage as computing until its first post (AD-11). Launch opens the URL's design when its id is stored and loads, otherwise the newest stored design (story 5's listDesigns), otherwise runs the NewDesign action, and replaces the URL to match (router.replace); a stored design opens through story 5's load flow, run by an action that opens a stored design (the Start screen's recent list reuses it, AD-13). A stored design that fails to load (load's not-found, any LoadError or design-invalid: a schema change before the first public preview, a torn write, a newer app in another tab) falls back the same way; the stored design keeps its id and stays untouched, and 16.1 adds the notices (Decision 2026-11-05). When the load flow's reset save fails at launch, launch does not fall back to the next stored design: it opens a new design, which autosave treats like any New design, and the load flow's notice carries the save's error (spine AD-13, 2026-11-07). When load or listDesigns returns storage-unavailable, launch opens a new, unsaved design and sets autosave's failure state to that error. The model worker spawns once the first design is loaded (story 4). start-main.ts's call to story 4's start(spawn) is the app's first production worker spawn, so this story sets worker.format 'es' in app/vite.config.ts, as app/vitest.config.ts already does, not Vite's default 'iife', which can't hold the model-worker start file's top-level await and would inline 13.21's per-version scripts (spine Data Schema, LibraryData note). Story 8 draws the chrome around it."
verify = "In Vitest browser mode in Chromium and Firefox (an end-to-end test only where AGENTS.md's bar allows, settled by the unknown below): with empty storage, launch opens /#/design/<id>/layout for a new design; a reload reopens the same design; with two stored designs, a URL naming the older opens it, and a URL naming an unknown id opens the newest and the URL is replaced with its id; /#/design/<id>/bogus and /#/design/<id> open layout and the URL is replaced with /#/design/<id>/layout; with browser storage that can't be opened, launch opens a new design and autosave's failure state holds storage-unavailable with its message; a test command whose handle declares a static hotkey runs on that key with its input builder's input, and a test UiAction's hotkey runs its apply; the NewDesign action's test passes at the level the unknown settles; the production bundle holds no devtools code; lint rejects a component importing a service as a value; with an autosave that no longer parses, one that is not valid KDL and one with format-version 2, launch opens a new design and the stored one is unchanged; with a stored design whose routing file is unreadable and a reset save refused for space, launch opens a new design, the stored design is unchanged and the load flow reports quota-exceeded; the production build's model worker is an ES module worker."
