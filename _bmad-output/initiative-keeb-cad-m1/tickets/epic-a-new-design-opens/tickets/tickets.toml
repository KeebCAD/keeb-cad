description = "The chrome per EXPERIENCE.md › Global chrome and DESIGN.md › Components: the top bar (design name), workspace tabs on story 6's Tabs wrapper in workspaceSchema's option order (role=tablist, keys 1-5, the URL follows, and each switch sends focus with the new workspace through workers), the status strip (error and warning counts from the posted issues: the last known numbers, dimmed with ◌ while their seq is behind main's, 0 before the first issues; until 13.17 or 13.18 adds the first violation kind only zero counts can be posted, so this story tests zero and dimmed zero; when more than 1000 ms have passed since a stage-started arrived on main, the running stage by its StageId, its elapsed time in whole seconds (2 s) and a RestartModelWorker action class in commands (the Restart action), until the next post clears it; after story 4's crash cap, failed: <message> for the model worker, naming the stage when one was running at the last crash (its stage-started in the crashing epoch with no later post), with Restart, until Restart: this story widens workers' ModelWorkerStatus (23.4 codes a bare 'failed') to carry workers' WorkerFailed { message, stage? }, the message being the error event's message or a fixed text from workers for a message that failed to deserialize, and changes 23.4's crash count so stage-started no longer resets it, only a stage output or an issues post does (23.4 resets on any accepted post; spine AD-11, 2026-11-07); Assumption (Sofia, 2026-11-07): derived-files keeps resetting it, as issues does, not dropped, because both are posted at every seq, so dropping it changes nothing the count can see; 13.7 adds cursor and zoom with the viewport), the left rail with the Tree slide-out shell (T, Esc, empty text; 13.7 fills it with nodes), the docked 320px right-panel region and the canvas region: the empty Layout shows EXPERIENCE's hint verbatim (G and Ctrl+K stay inert until 13.7 and the palette story), workspaces 2-5 an empty canvas region with no text. Each region root is a focusable, labelled landmark (tabindex=-1, aria-label); F6 and Shift+F6 cycle EXPERIENCE's order (top bar, slide-out when open, canvas, inspector, status strip) and land on a region even when it is empty. Keys 1-5, T, Esc and F6 are UiAction classes (story 7). Both themes at 1366x768. Tab badges, the save state, the File and Export menus and undo/redo are owned by other slices."
