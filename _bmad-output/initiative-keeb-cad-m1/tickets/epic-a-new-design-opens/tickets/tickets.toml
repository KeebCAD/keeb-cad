them). Main's container is a di container built in app's main.ts, and a second registration throws DuplicateRegistrationError; story 7 provides it to components. The design's meta section (design id, name, form; AD-8's first section) is the store's first real data: its Valibot schema in schema, and the Design type, the store and replaceDesign's parse are built on it, so story 3 extends them to the other sections instead of replacing a placeholder. Built to AGENTS.md's code layout and test rules (2026-11-03). Proven with a test-only command that renames the design; newDesign and id minting stay in story 3, the gap, Length and Expression in 13.2, defaultPart and ref(kind) in 13.18, provenance in 22.1; the stale-seq check waits for the first drop or nudge command (epic-drag-keys)."
