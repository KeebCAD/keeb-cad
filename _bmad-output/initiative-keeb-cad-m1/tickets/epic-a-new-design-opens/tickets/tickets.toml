title = "The model worker mirrors the design"
description = "messaging's generic machine (one dispatcher per side, transfer lists, the seq gate; the request side, messaging's typed stale reply and workers' pending requests with reject-all on restart, waits for the first story with a request kind, Decision 2026-11-07 in this story's plan) and protocol's first messages: the whole design, patches (schema's DesignPatch[]) with (epoch, seq), focus { workspace: Workspace }, issues { seq, violations: Violation[] } and stage-started { stage: StageId, seq } (AD-11). schema gains DesignPatch (moved from design; Immer's Patch and DesignPatch stay assignable both ways, which DesignPatcher's change and apply prove by compiling), workspaceSchema and Workspace, stageIdSchema and StageId (the model worker's seven stages), and Violation's shape with ViolationKind and fixSchema empty, so only an empty violations list type-checks (spine 2026-11-07). workers spawns the model worker only once the design store holds its first Committed, so its first message is that whole bundle and the mirror is never empty (load, then spawn); it sends focus at worker start with the workspace its start is given, layout when none is (story 7 passes the URL's) and on every workspace switch (story 8 calls it). app's model-worker start file, which model.worker.ts re-exports (as main.ts re-exports start-main.ts), builds its container from the worker modules and awaits autoLoad(); the fences that name app/src/model.worker.ts as the only importer of design/worker, model/worker and library/worker take its start file as well, each with its violation fixture updated (the spine's start-file pattern; dependency-cruiser today names the entry alone); it makes no createDerivations call, which 13.18 adds with the first derivation, and pipeline reaches the mirror only through design/worker (spine 2026-11-07). design/worker gains the mirror and its writer (AD-25). workers sends the whole bundle (the design with both derived files, which the bundle always holds from story 3) at worker start and restart, read from the store, and on replaceDesign, from the Committed its commit event carries (a new design arrives this way), then each applied command's patches, as undo and redo send the routing file they restore; pipeline echoes the derived files it holds at every seq (AD-13); pipeline receives them and applies them in order through design/worker's writer (2's DesignPatcher.apply), after deep-freezing each whole design it receives with deepFreeze, so the mirror is deep-frozen. The worker posts empty issues at every seq, echoing it (the first violation kind arrives with 13.17 or 13.18); it runs no stage, so it posts no stage-started until 13.18's parts stage, while workers already receives and gates it; workers drops a post from an older seq or another epoch. On a crash (the worker's error event or a message that fails to deserialize) workers restarts the worker with a new epoch and the whole design; after 3 consecutive crashes with no successful post between them it stops restarting and workers' status reads failed until a restart is asked for (story 8's Restart action; what the strip names then is story 8's). The mirror's hash check waits for its spike (spine Open Questions)."
