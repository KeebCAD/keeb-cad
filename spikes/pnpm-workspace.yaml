# Standalone workspace root for the throwaway epic-risk-spikes project.
# Deliberately outside the repo's root workspace; strictness mirrors the root.
packages:
  - '.'

strictPeerDependencies: true
hoist: false
publicHoistPattern: []

# Finding: tscircuit's transitive debug/visualisation deps fail strict peer checks.
# Scoped exemptions only (strictPeerDependencies stays true); see README.md.
#   - @tscircuit/solver-utils, graphics-debug, @tscircuit/alphabet, stack-svgs want typescript ^5.
#   - graphics-debug pulls react-dom 19 beside react 18. Neither is loaded by the
#     AutoroutingPipelineSolver path that the spike runs.
peerDependencyRules:
  allowedVersions:
    '@tscircuit/solver-utils>typescript': '6'
    'graphics-debug>typescript': '6'
    '@tscircuit/alphabet>typescript': '6'
    'stack-svgs>typescript': '6'
    'react-dom>react': '18'
