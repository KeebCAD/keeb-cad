# Runs every check (`pnpm check`) and the mutation gate on every push, to any branch. No hosting
# or deploy.
# Actions are pinned by commit SHA, since tags can move.
name: check

on: push

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Playwright's image carries Chromium, Firefox and their system packages, so the job installs
    # no browsers: `playwright install --with-deps` hung on the runner's apt mirror (4 of about 25
    # runs on 2026-11-06). Vitest browser mode (packages/editor/vitest.config.ts) needs both
    # browsers, the smoke test Chromium. The tag is the locked Playwright version, checked by
    # tooling/playwright-image.spec.ts. User 1001 is the runner's, which owns the workspace.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version`: pnpm comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Node comes from mise.toml, the same pin mise uses locally.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Stryker mutates the priority packages' pure files and fails below the break threshold in
  # stryker.config.json. Its tests run on Node only, so no browsers are installed.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:mutation
