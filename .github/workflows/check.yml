# Runs every check (`pnpm check`) on every push, to any branch. No hosting or deploy.
# Actions are pinned by commit SHA, since tags can move.
name: check

on: push

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A normal run takes a few minutes; `playwright install --with-deps` has hung on apt before.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version`: pnpm comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Node comes from mise.toml, the same pin mise uses locally.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vitest browser mode runs the app's tests in both (app/vitest.config.ts); the smoke test needs Chromium.
      - run: pnpm --filter @keeb-cad/editor exec playwright install --with-deps chromium firefox
      - run: pnpm check
